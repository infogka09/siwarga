          columnStyles: {
            0: { cellWidth: 32 },
            1: { cellWidth: 'auto' },
            2: { cellWidth: 42, halign: 'right', fontStyle: 'bold' }
          }
        });

        // Blok Tanda Tangan Resmi (cegah terpotong antar halaman)
        let sigY = doc.lastAutoTable.finalY + 14;
        if (sigY > pageH - 42) {
          doc.addPage();
          sigY = 24;
        }
        const leftX = margin + contentW * 0.25;
        const rightX = margin + contentW * 0.75;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(71, 85, 105);
        doc.text('Mengetahui,', leftX, sigY, { align: 'center' });
        doc.text('Disusun oleh,', rightX, sigY, { align: 'center' });
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(30, 41, 59);
        doc.text('Ketua ' + namaRt, leftX, sigY + 5, { align: 'center' });
        doc.text('Bendahara ' + namaRt, rightX, sigY + 5, { align: 'center' });

        const nameY = sigY + 24;
        doc.text(cfg.ketua_rt || '____________________', leftX, nameY, { align: 'center' });
        doc.text(cfg.bendahara_rt || '____________________', rightX, nameY, { align: 'center' });
        doc.setDrawColor(30, 41, 59);
        doc.line(leftX - 24, nameY + 1, leftX + 24, nameY + 1);
        doc.line(rightX - 24, nameY + 1, rightX + 24, nameY + 1);

        // Footer nomor halaman di setiap halaman
        const totalPages = doc.internal.getNumberOfPages();
        for (let p = 1; p <= totalPages; p++) {
          doc.setPage(p);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.5);
          doc.setTextColor(148, 163, 184);
          doc.text('SIWARGA GKA (Sistem Informasi Warga GKA) · Laporan Keuangan ' + namaRt, margin, pageH - 8);
          doc.text('Halaman ' + p + ' / ' + totalPages, pageW - margin, pageH - 8, { align: 'right' });
        }

        const fileTag = filterMode.value === 'month' && selectedPeriode.value
          ? SiwargaAPI.formatPeriodeID(selectedPeriode.value)
          : (filters.startDate && filters.endDate
            ? (SiwargaAPI.formatDateID(filters.startDate) + '_sd_' + SiwargaAPI.formatDateID(filters.endDate))
            : 'Semua_Periode');
        doc.save('Laporan_Buku_Kas_SIWARGA_' + fileTag + '.pdf');
        $q.notify({ type: 'positive', message: 'Laporan PDF berhasil diunduh!' });
      } catch (err) {
        $q.notify({ type: 'negative', message: err && err.message ? err.message : 'Gagal membuat file PDF.' });
      } finally {
        exportingPdf.value = false;
      }
    }

    function exportCsv() {
      const headers = ['Tanggal', 'Tipe', 'Kategori', 'Deskripsi', 'Metode', 'Masuk', 'Keluar', 'Saldo Berjalan', 'Pencatat'];
      const lines = [headers.join(',')];
      (report.ledger || []).forEach(r => {
        const vals = [
          SiwargaAPI.formatDateID(r.tanggal), r.tipe, r.kategori, r.deskripsi, r.metode,
          r.debit || 0, r.kredit || 0, r.saldo_berjalan || 0, r.dicatat_oleh
        ].map(v => '"' + String(v || '').replace(/"/g, '""') + '"');
        lines.push(vals.join(','));
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const csvTag = filterMode.value === 'month' && selectedPeriode.value
        ? SiwargaAPI.formatPeriodeID(selectedPeriode.value)
        : 'Semua_Periode';
      a.download = 'Buku_Kas_SIWARGA_' + csvTag + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    onMounted(loadReport);

    return {
      loading, exportingPdf, currentYm, filterMode, selectedPeriode, periodeOptions, activePeriodLabel,
      filters, report, ledgerColumns, loadReport, onChangeFilterMode, shiftMonth, goCurrentMonth, selectRecapMonth,
      resetFilters, printReport, exportPdf, exportCsv, formatFuturePeriods,
      formatRupiah: SiwargaAPI.formatRupiah, formatDateID: SiwargaAPI.formatDateID, formatPeriodeID: SiwargaAPI.formatPeriodeID
    };
  }
};
</script>

    function isCustomRoleAllowed(menuKey, cr) {
      const item = menuState[menuKey];
      if (!item) return false;
      const roles = Array.isArray(item.roles) ? item.roles : [];
      const denied = Array.isArray(item.denied_roles) ? item.denied_roles : [];
      if (roles.indexOf(cr.code) !== -1) return true;
      if (denied.indexOf(cr.code) !== -1) return false;
      return roles.indexOf(cr.base_role || 'warga') !== -1;
    }

    function toggleCustomRoleMenu(menuKey, cr) {
      const item = menuState[menuKey];
      if (!item) return;
      if (!Array.isArray(item.roles)) item.roles = [];
      if (!Array.isArray(item.denied_roles)) item.denied_roles = [];
      const currentlyOn = isCustomRoleAllowed(menuKey, cr);
      item.roles = item.roles.filter(r => r !== cr.code);
      item.denied_roles = item.denied_roles.filter(r => r !== cr.code);
      if (currentlyOn) {
        item.denied_roles.push(cr.code);
      } else {

        return;
      }
      if (editingRoleCode.value) {
        const idx = customRoles.value.findIndex(r => r.code === editingRoleCode.value);
        if (idx >= 0) {
          customRoles.value[idx] = {
            code: editingRoleCode.value,
            label: label,
            base_role: roleDraft.base_role || 'warga',
            color: roleDraft.color || 'teal-8',
            core: false
          };
        }
        resetRoleDraft();
        return;
      }
      const code = label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
      if (!code || ['superadmin', 'admin', 'bendahara', 'warga'].indexOf(code) !== -1) {
        $q.notify({ type: 'warning', message: 'Nama peran tersebut sudah termasuk peran inti sistem.' });
        return;
      }
      if (customRoles.value.some(r => r.code === code)) {
        $q.notify({ type: 'warning', message: 'Peran dengan kode "' + code + '" sudah ada di daftar.' });
        return;
      }
      customRoles.value.push({
        code: code,
        label: label,
        base_role: roleDraft.base_role || 'warga',
        color: roleDraft.color || 'teal-8',
        core: false

    function getLocalTodayStr() {
      const d = new Date();
      const pad = n => (n < 10 ? '0' + n : String(n));
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function isLoginToday(isoStr) {
      if (!isoStr) return false;
      return String(isoStr).trim().substring(0, 10) === getLocalTodayStr();
    }

    function formatLoginTime(val) {
      if (!val) return '-';
      const s = String(val).trim();
      const tzMatch = s.match(/\s+(WIB|WITA|WIT|UTC[+-]\d{1,2}(?::\d{2})?)$/);
      const tz = tzMatch ? tzMatch[1] : 'WIB';
      return SiwargaAPI.formatDateTimeID(s) + ' ' + tz;
    }

      const base = users.value.filter(u => filterUserRole.value === 'Semua' || u.role === filterUserRole.value);
      let sudahLogin = 0;
      let hariIni = 0;
      let belumLogin = 0;
      base.forEach(u => {
        if (u.last_login_at) {
          sudahLogin++;
          if (isLoginToday(u.last_login_at)) hariIni++;
        } else {
          belumLogin++;
        }
      });
      return { total: base.length, sudahLogin, hariIni, belumLogin };
    });

          if (filterUserLogin.value === 'Hari Ini' && !isLoginToday(u.last_login_at)) return false;
          if (filterUserLogin.value === 'Sudah Login' && !u.last_login_at) return false;
          if (filterUserLogin.value === 'Belum Pernah Login' && !!u.last_login_at) return false;
          if (!q) return true;
          return [u.username, u.nama, u.no_rumah, u.role, getRoleBadgeLabel(u.role)].some(v => String(v || '').toLowerCase().includes(q));

    const { ref, reactive, computed, onMounted } = Vue;
    const $q = Quasar.useQuasar();

    const tab = ref(props.initialTab === 'password' ? 'password' : 'data');
    const loading = ref(false);
    const savingProfile = ref(false);
    const savingPwd = ref(false);
    const showCur = ref(false);
    const showNew = ref(false);
    const showConf = ref(false);

    const profileUser = ref(Object.assign({}, props.user));
    const keluarga = ref(null);
    const anggotaList = ref([]);
    const selectedWargaId = ref('');

    const accountForm = reactive({ nama_akun: props.user.nama || '' });
    const kkForm = reactive({ no_kk: '', kepala_keluarga: '', no_hp: '', email: '', alamat: '', status_hunian: 'Tetap' });

    });
    const pwdForm = reactive({ current_password: '', new_password: '', confirm_password: '' });

      const n = (profileUser.value && profileUser.value.nama) || 'U';
      return n.split(' ').slice(0, 2).map(s => s[0] || '').join('').toUpperCase();
    });

    const anggotaOptions = computed(() => anggotaList.value.map(w => ({
      value: w.id,
      label: w.nama_lengkap + ' (' + (w.hubungan_keluarga || 'Anggota') + ')'
    })));

    function applyProfileResponse(res) {
      if (!res) return;
      profileUser.value = res.user || props.user;
      accountForm.nama_akun = profileUser.value.nama || '';
      keluarga.value = res.keluarga || null;
      anggotaList.value = res.anggota || [];

          no_kk: keluarga.value.no_kk || '',
          kepala_keluarga: keluarga.value.kepala_keluarga || '',
          no_hp: keluarga.value.no_hp || '',
          email: keluarga.value.email || '',
          alamat: keluarga.value.alamat || '',
          status_hunian: keluarga.value.status_hunian === 'Kontrak' ? 'Kontrak' : 'Tetap'
        });
      }
      if (anggotaList.value.length) {
        const keep = anggotaList.value.find(w => w.id === selectedWargaId.value) || anggotaList.value[0];
        selectedWargaId.value = keep.id;
        onSelectAnggota(keep.id);

      const found = anggotaList.value.find(w => w.id === id);
      if (!found) return;
      Object.assign(wargaForm, {

        jenis_kelamin: found.jenis_kelamin || 'L',

        tanggal_lahir: found.tanggal_lahir || '',
        hubungan_keluarga: found.hubungan_keluarga || 'Anggota',
        agama: found.agama || 'Islam',
        status_perkawinan: found.status_perkawinan || 'Belum Kawin',

        no_hp: found.no_hp || ''

      Object.assign(wargaForm, {

      });

    }

    async function loadProfile() {
      loading.value = true;
      try {
        const res = await SiwargaAPI.call('getMyProfile');
        applyProfileResponse(res);
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loading.value = false;
      }
    }

    async function submitProfile() {
      savingProfile.value = true;
      try {
        const payload = {
          nama_akun: accountForm.nama_akun,
          keluarga: keluarga.value ? Object.assign({}, kkForm) : null,
          warga: (keluarga.value && wargaForm.nama_lengkap) ? Object.assign({}, wargaForm) : null
        };
        const res = await SiwargaAPI.call('updateMyProfile', payload);
        applyProfileResponse(res);
        emit('user-updated', res.user);
        $q.notify({ type: 'positive', message: 'Data diri & keluarga berhasil diperbarui!' });
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        savingProfile.value = false;
      }
    }

    async function submitPassword() {
      savingPwd.value = true;
      try {
        const res = await SiwargaAPI.call('changeMyPassword', Object.assign({}, pwdForm));
        pwdForm.current_password = '';
        pwdForm.new_password = '';
        pwdForm.confirm_password = '';
        emit('password-changed', Boolean(res && res.must_change_password));
        $q.notify({ type: 'positive', message: (res && res.message) || 'Password berhasil diperbarui!' });
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        savingPwd.value = false;
      }
    }

    const roleMeta = computed(() => SiwargaAPI.getRoleMeta(profileUser.value.role || (props.user && props.user.role) || 'warga', props.settings));

    onMounted(loadProfile);

    return {
      tab, loading, savingProfile, savingPwd, showCur, showNew, showConf,
      profileUser, keluarga, anggotaList, selectedWargaId, anggotaOptions,
      accountForm, kkForm, wargaForm, pwdForm, initials, roleMeta,
      onSelectAnggota, startNewAnggota, submitProfile, submitPassword,
      formatRupiah: SiwargaAPI.formatRupiah
    };
  }
};
</script>

        const mobileNavItems = computed(() => {
          const candidates = [
            { key: 'dashboard', icon: 'dashboard', label: 'Beranda', badge: 0 }
          ];
          if (isMenuVisible('finance_ipl')) {
            candidates.push({ key: 'finance_ipl', icon: 'receipt_long', label: 'Bayar IPL', badge: 0 });
          }
          if (canManageFinance.value && isMenuVisible('finance_verif')) {
            candidates.push({ key: 'finance_verif', icon: 'fact_check', label: 'Verifikasi', badge: pendingVerifCount.value || 0 });
          }
          if (isMenuVisible('finance_kas')) {
            candidates.push({ key: 'finance_kas', icon: 'swap_vert', label: 'Arus Kas', badge: 0 });
          }
          if (isMenuVisible('finance_report')) {
            candidates.push({ key: 'finance_report', icon: 'account_balance', label: 'Laporan', badge: 0 });
          }

          const hasExtraMenus = hasAnyPortalMenu.value || canAccessSettings.value || candidates.length > 4;
          if (!hasExtraMenus) {
            return candidates.concat([{ key: 'profile', icon: 'account_circle', label: 'Profil', badge: 0 }]);
          }
          return candidates.slice(0, 4).concat([{ key: '__drawer__', icon: 'menu', label: 'Menu', badge: 0 }]);
        });

        function onMobileNavClick(key) {
          if (key === '__drawer__') {
            leftDrawerOpen.value = !leftDrawerOpen.value;
            return;
          }
          navigate(key);
        }

        function menuLabel(menuKey) {
          const item = menuConfig.value[menuKey];
          return (item && item.label) || MENU_TITLES[menuKey] || menuKey;
        }

        function groupLabel(groupKey) {
          const g = menuConfig.value._groups || {};
          return g[groupKey] || (groupKey === 'portal' ? 'MENU UTAMA' : 'SIWARGA FINANCE');
        }

        const activeMenuTitle = computed(() => {
          if (menuConfig.value[activePage.value] && menuConfig.value[activePage.value].label) {
            return menuConfig.value[activePage.value].label;
          }
          return MENU_TITLES[activePage.value] || 'SIWARGA GKA (Sistem Informasi Warga GKA)';
        });

        const userInitials = computed(() => {
          const name = (currentUser.value && currentUser.value.nama) || 'U';
          return name.split(' ').slice(0, 2).map(s => s[0] || '').join('').toUpperCase();
        });

        function roleLabel(role) {
          if (role === 'admin') return 'Ketua / Admin RT';
          return SiwargaAPI.getRoleMeta(role, settings).label;
        }

        function navigate(page) {
          if (page !== 'dashboard' && page !== 'settings' && page !== 'profile' && !isMenuVisible(page)) {
            $q.notify({ type: 'warning', message: 'Menu ini sedang dinonaktifkan atau tidak tersedia untuk peran Anda.' });
            activePage.value = 'dashboard';
            return;
          }
          if (page === 'settings' && !canAccessSettings.value) {
            activePage.value = 'dashboard';
            return;
          }
          if (page === 'profile') {
            profileInitialTab.value = 'data';
          }
          activePage.value = page;
          if ($q.screen.lt.md) leftDrawerOpen.value = false;
        }

        function openChangePassword() {
          profileInitialTab.value = 'password';
          activePage.value = 'profile';
          if ($q.screen.lt.md) leftDrawerOpen.value = false;
        }

        function openIplWithBill(billId) {
          pendingPayBillId.value = billId || '';
          navigate('finance_ipl');
        }

        function onPasswordChanged(stillWeak) {
          if (currentUser.value) {
            currentUser.value = Object.assign({}, currentUser.value, { must_change_password: Boolean(stillWeak) });
          }
        }

        function onUpdateBadges(info) {
          if (info && typeof info.pendingVerif === 'number') {
            pendingVerifCount.value = info.pendingVerif;
          }
        }

        async function refreshBadgeCounts() {
          if (!currentUser.value || !canManageFinance.value) return;
          try {
            const bills = await SiwargaAPI.call('getTagihanIpl', { periode: 'ALL' }) || [];
            pendingVerifCount.value = bills.filter(b => b.status === 'Menunggu Verifikasi').length;
          } catch (e) {}
        }

        function onSettingsUpdated(newSettings) {
          Object.assign(settings, newSettings || {});
        }

        function onUserUpdated(updatedUser) {
          if (updatedUser && currentUser.value) {
            currentUser.value = Object.assign({}, currentUser.value, updatedUser);
          }
        }

        async function refreshPublicConfig() {
          try {
            const cfg = await SiwargaAPI.call('getPublicConfig');
            if (cfg && typeof cfg === 'object') {
              Object.assign(settings, cfg);
            }
          } catch (err) {
            console.error('refreshPublicConfig error:', err);
          }
        }

        async function onImpersonateStarted(res) {
          if (!res || !res.token || !res.user) return;
          SiwargaAPI.setToken(res.token);
          await refreshPublicConfig();
          currentUser.value = res.user;
          activePage.value = 'dashboard';
          pendingVerifCount.value = 0;
          $q.notify({
            type: 'positive',
            message: 'Berhasil masuk sebagai ' + res.user.nama + ' (' + res.user.username + ')'
          });
          refreshBadgeCounts();
        }

        async function handleStopImpersonate() {
          stoppingImpersonate.value = true;
          try {
            const res = await SiwargaAPI.call('stopImpersonate');
            SiwargaAPI.setToken(res.token);
            await refreshPublicConfig();
            currentUser.value = res.user;
            activePage.value = 'settings';
            $q.notify({
              type: 'info',
              message: 'Kembali ke akun ' + res.user.nama
            });
            refreshBadgeCounts();
          } catch (err) {
            $q.notify({ type: 'negative', message: err.message });
          } finally {
            stoppingImpersonate.value = false;
          }
        }

        async function bootstrap() {
          try {
            await refreshPublicConfig();
            const token = SiwargaAPI.getToken();
            if (token) {
              const sess = await SiwargaAPI.call('checkSession');
              if (sess && sess.user) {
                currentUser.value = sess.user;
                refreshBadgeCounts();
              } else {
                SiwargaAPI.setToken('');
              }
            }
          } catch (err) {
            console.error(err);
          } finally {
            appReady.value = true;
          }
        }

        async function handleLogin() {
          loginLoading.value = true;
          try {
            const d = new Date();
            const pad2 = n => (n < 10 ? '0' + n : String(n));
            const clientLoginAt = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
              'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
            const offsetMin = -d.getTimezoneOffset();
            let clientTz = 'WIB';
            if (offsetMin === 420) clientTz = 'WIB';
            else if (offsetMin === 480) clientTz = 'WITA';
            else if (offsetMin === 540) clientTz = 'WIT';
            else {
              const sign = offsetMin >= 0 ? '+' : '-';
              const absH = Math.floor(Math.abs(offsetMin) / 60);
              const absM = Math.abs(offsetMin) % 60;
              clientTz = 'UTC' + sign + absH + (absM ? ':' + pad2(absM) : '');
            }
            const res = await SiwargaAPI.call('login', {
              username: loginForm.username,
              password: loginForm.password,
              client_login_at: clientLoginAt,
              client_tz: clientTz
            });
            try {
              if (rememberUsername.value) localStorage.setItem('siwarga_saved_username', loginForm.username);
              else localStorage.removeItem('siwarga_saved_username');
            } catch (e) {}
            SiwargaAPI.setToken(res.token);
            await refreshPublicConfig();
            currentUser.value = res.user;
            activePage.value = 'dashboard';
            $q.notify({ type: 'positive', message: 'Selamat datang, ' + res.user.nama });
            refreshBadgeCounts();
          } catch (err) {
            $q.notify({ type: 'negative', message: err.message });
          } finally {
            loginLoading.value = false;
          }
        }

        function confirmLogout() {
          const nama = (currentUser.value && currentUser.value.nama) || 'akun ini';
          $q.dialog({
            title: 'Konfirmasi Keluar',
            message: 'Apakah Anda yakin ingin keluar dari sesi ' + nama + '?',
            cancel: { label: 'Batal', flat: true, color: 'grey-8' },
            ok: { label: 'Ya, Keluar', color: 'negative', unelevated: true },
            persistent: true
          }).onOk(handleLogout);
        }

        async function handleLogout() {
          try {
            await SiwargaAPI.call('logout');
          } catch (e) {}
          SiwargaAPI.setToken('');
          currentUser.value = null;
          loginForm.password = '';
          $q.notify({ type: 'info', message: 'Anda telah keluar dari SIWARGA.' });
        }

        onMounted(() => {
          bootstrap();
          greetingTimer = setInterval(() => {
            nowHour.value = new Date().getHours();
          }, 30000);
        });

        return {
          appReady,
          isMockMode: SiwargaAPI.isMockMode,
          currentUser,
          leftDrawerOpen,
          activePage,
          profileInitialTab,
          pendingPayBillId,
          activeMenuTitle,
          pendingVerifCount,
          isSuperadmin,
          canManageFinance,
          canAccessSettings,
          hasAnyPortalMenu,
          hasAnyFinanceMenu,
          mobileNavItems,
          onMobileNavClick,
          isMenuVisible,
          menuLabel,
          groupLabel,
          userInitials,
          showPassword,
          loginLoading,
          stoppingImpersonate,
          loginHelpDialog,
          rememberUsername,
          greetingText,
          greetingIcon,
          loginForm,
          settings,
          roleLabel,
          navigate,
          openChangePassword,
          openIplWithBill,
          onPasswordChanged,
          onUpdateBadges,
          refreshBadgeCounts,
          onSettingsUpdated,
          onUserUpdated,
          onImpersonateStarted,
          handleStopImpersonate,
          handleLogin,
          confirmLogout,
          handleLogout
        };
      }
    });

    app.config.errorHandler = function (err) {
      console.error('Vue Error:', err);
    };

    app.component('siwarga-logo', {
      props: {
        src: { type: String, default: '' },
        size: { type: Number, default: 44 },
        variant: { type: String, default: 'color' }
      },
      template: `
        <div
          class="row items-center justify-center overflow-hidden"
          :style="{
            width: size + 'px',
            height: size + 'px',
            minWidth: size + 'px',
            maxWidth: size + 'px',
            minHeight: size + 'px',
            maxHeight: size + 'px',
            flex: '0 0 ' + size + 'px',
            borderRadius: Math.round(size * 0.24) + 'px',
            background: variant === 'light' ? '#ffffff' : 'linear-gradient(135deg, #0f766e 0%, #115e59 100%)',
            boxShadow: '0 2px 8px rgba(15, 118, 110, 0.22)'
          }"
        >
          <img
            v-if="src"
            :src="src"
            alt="Logo Perumahan GKA"
            style="width:100%;height:100%;object-fit:contain;padding:3px;"
          />
          <svg v-else viewBox="0 0 64 64" :width="size" :height="size" xmlns="http://www.w3.org/2000/svg" aria-label="Logo Perumahan GKA">
            <!-- Siluet atap cluster perumahan + aksen emas -->
            <path d="M11 31 L32 13 L53 31" fill="none" :stroke="variant === 'light' ? '#0f766e' : '#ffffff'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M22 28 L32 19 L42 28" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Jendela rumah kecil -->
            <rect x="29.5" y="27" width="5" height="4.5" rx="1" :fill="variant === 'light' ? '#0f766e' : '#99f6e4'" />
            <!-- Garis pemisah tipis -->
            <line x1="15" y1="35" x2="49" y2="35" :stroke="variant === 'light' ? '#cbd5e1' : 'rgba(255,255,255,0.28)'" stroke-width="1.5" stroke-linecap="round" />
            <!-- Monogram GKA -->
            <text
              x="32"
              y="52"
              text-anchor="middle"
              font-family="Plus Jakarta Sans, Arial, sans-serif"
              font-weight="800"
              font-size="17"
              letter-spacing="1.4"
              :fill="variant === 'light' ? '#0f766e' : '#ffffff'"
            >GKA</text>
          </svg>
        </div>
      `
    });

    app.component('comp-dashboard', window.CompDashboard);
    app.component('comp-warga', window.CompWarga);
    app.component('comp-surat', window.CompSurat);
    app.component('comp-info', window.CompInfo);
    app.component('comp-kegiatan', window.CompKegiatan);
    app.component('comp-finance-ipl', window.CompFinanceIpl);
    app.component('comp-finance-verif', window.CompFinanceVerif);
    app.component('comp-finance-kas', window.CompFinanceKas);
    app.component('comp-finance-report', window.CompFinanceReport);
    app.component('comp-settings', window.CompSettings);
    app.component('comp-profile', window.CompProfile);

    app.use(Quasar, {
      config: {
        brand: {
          primary: '#0f766e',
          secondary: '#115e59',
          accent: '#6366f1',
          positive: '#16a34a',
          negative: '#dc2626',
          info: '#0284c7',
          warning: '#d97706'
        },
        notify: { position: 'top-right', timeout: 3000 }
      }
    });

    app.mount('#q-app');
  } catch (err) {
    console.error(err);
    showFatalError('Terjadi Kesalahan Saat Inisialisasi Aplikasi', err && err.stack ? err.stack : String(err));
  }
})();
</script>

</body>
</html>

<script>
/**
 * api.html — Klien API Google Apps Script + Fallback Mode Preview Lokal
 * Otomatis memakai google.script.run saat berjalan di Google Apps Script,
 * dan localStorage mock engine saat dibuka di browser lokal untuk pengujian.
 */
(function () {
  const TOKEN_KEY = 'siwarga_session_token';
  const MOCK_DB_KEY = 'siwarga_local_mock_db_v1';

  const isGasEnv = typeof google !== 'undefined' && google.script && google.script.run;
  function getRemoteApiUrl() {
    return typeof window !== 'undefined' && window.SIWARGA_API_URL
      ? String(window.SIWARGA_API_URL).trim()
      : '';
  }

  function formatRupiah(amount) {
    const num = Math.round(Number(amount || 0));
    const sign = num < 0 ? '-' : '';
    return sign + 'Rp ' + Math.abs(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function formatDateID(dateStr) {
    if (!dateStr) return '-';
    const s = String(dateStr).trim().substring(0, 10);
    const parts = s.split('-');
    if (parts.length !== 3 || parts[0].length !== 4) return s;
    return parts[2] + '-' + parts[1] + '-' + parts[0];
  }

  function formatDateTimeID(dateStr) {
    if (!dateStr) return '-';
    const s = String(dateStr).trim();
    const datePart = formatDateID(s);
    const m = s.match(/[T ](\d{2}:\d{2})/);
    return m ? (datePart + ' ' + m[1]) : datePart;
  }

  function formatPeriodeID(ymStr) {
    if (!ymStr) return '-';
    const s = String(ymStr).trim().substring(0, 7);
    const parts = s.split('-');
    if (parts.length !== 2 || parts[0].length !== 4) return s;
    return parts[1] + '-' + parts[0];
  }

  function buildPeriodeOptions(includeAll, pastMonths, futureMonths) {
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const now = new Date();
    const past = typeof pastMonths === 'number' ? pastMonths : 24;
    const future = typeof futureMonths === 'number' ? futureMonths : 12;
    const opts = [];
    if (includeAll) {
      opts.push({ value: '', label: 'Semua Periode' });
    }
    for (let offset = future; offset >= -past; offset--) {
      const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      opts.push({
        value: y + '-' + m,
        label: m + '-' + y + ' (' + months[d.getMonth()] + ' ' + y + ')'
      });
    }
    return opts;
  }

  function expandPeriodeRange(startYm, endYm) {
    const s = String(startYm || '').trim();
    const e = String(endYm || '').trim();
    if (!/^\d{4}-\d{2}$/.test(s) || !/^\d{4}-\d{2}$/.test(e) || s > e) return [];
    const sp = s.split('-');
    const ep = e.split('-');
    let y = parseInt(sp[0], 10);
    let m = parseInt(sp[1], 10);
    const ey = parseInt(ep[0], 10);
    const em = parseInt(ep[1], 10);
    const out = [];
    while (y < ey || (y === ey && m <= em)) {
      out.push(y + '-' + (m < 10 ? '0' + m : String(m)));
      if (out.length >= 36) break;
      m++;
      if (m > 12) { m = 1; y++; }
    }
    return out;
  }

  function formatPeriodsSummary(periods, includeCount) {
    const list = Array.isArray(periods) ? periods.slice().sort() : [];
    if (!list.length) return '-';
    if (list.length === 1) return formatPeriodeID(list[0]);
    function nextYm(ym) {
      const p = ym.split('-');
      let y = parseInt(p[0], 10);
      let m = parseInt(p[1], 10) + 1;
      if (m > 12) { m = 1; y++; }
      return y + '-' + (m < 10 ? '0' + m : String(m));
    }
    const runs = [];
    let start = list[0];
    let prev = list[0];
    for (let i = 1; i < list.length; i++) {
      if (list[i] === nextYm(prev)) {
        prev = list[i];
      } else {
        runs.push(start === prev ? formatPeriodeID(start) : (formatPeriodeID(start) + ' s/d ' + formatPeriodeID(prev)));
        start = list[i];
        prev = list[i];
      }
    }
    runs.push(start === prev ? formatPeriodeID(start) : (formatPeriodeID(start) + ' s/d ' + formatPeriodeID(prev)));
    return includeCount === false ? runs.join(', ') : (runs.join(', ') + ' (' + list.length + ' bln)');
  }

  function readFileAsPayload(file) {
    return new Promise(function (resolve, reject) {
      if (!file) return resolve(null);
      if (file.size > 5 * 1024 * 1024) {
        return reject(new Error('Ukuran file maksimal 5 MB.'));
      }
      const reader = new FileReader();
      reader.onload = function () {
        resolve({
          fileName: file.name,
          mimeType: file.type || 'image/jpeg',
          base64Data: reader.result
        });
      };
      reader.onerror = function () {
        reject(new Error('Gagal membaca file yang dipilih.'));
      };
      reader.readAsDataURL(file);
    });
  }

  function parseMenuConfig(settingsObj) {
    let parsed = {};
    try {
      parsed = settingsObj && settingsObj.menu_config_json ? JSON.parse(settingsObj.menu_config_json) : {};
    } catch (e) {
      parsed = {};
    }
    const merged = {
      _groups: {
        portal: (parsed._groups && String(parsed._groups.portal || '').trim()) || DEFAULT_MENU_CONFIG._groups.portal,
        finance: (parsed._groups && String(parsed._groups.finance || '').trim()) || DEFAULT_MENU_CONFIG._groups.finance
      },
      _permissions: {
        verif_revisi_roles: (parsed._permissions && Array.isArray(parsed._permissions.verif_revisi_roles))
          ? parsed._permissions.verif_revisi_roles.slice()
          : DEFAULT_MENU_CONFIG._permissions.verif_revisi_roles.slice()
      }
    };
    Object.keys(DEFAULT_MENU_CONFIG).forEach(function (key) {
      if (key === '_groups' || key === '_permissions') return;
      const def = DEFAULT_MENU_CONFIG[key];
      const cur = parsed[key] || {};
      merged[key] = {
        enabled: key === 'dashboard' ? true : (cur.enabled !== undefined ? Boolean(cur.enabled) : def.enabled),
        label: (cur.label && String(cur.label).trim()) ? String(cur.label).trim() : def.label,
        roles: Array.isArray(cur.roles) ? cur.roles.slice() : def.roles.slice(),
        denied_roles: Array.isArray(cur.denied_roles) ? cur.denied_roles.slice() : []
      };
    });
    return merged;
  }

  function parseCustomRoles(settingsObj) {
    try {
      if (settingsObj && settingsObj.custom_roles_json) {
        const parsed = JSON.parse(settingsObj.custom_roles_json);
        if (Array.isArray(parsed)) {
          return parsed.filter(function (r) { return r && r.code && r.label; }).map(function (r) {
            return {
              code: String(r.code).trim().toLowerCase(),
              label: String(r.label).trim(),
              base_role: (r.base_role === 'admin' || r.base_role === 'bendahara' || r.base_role === 'warga') ? r.base_role : 'warga',
              color: String(r.color || 'teal-8').trim() || 'teal-8',
              core: false
            };
          });
        }
      }
    } catch (e) {}
    return DEFAULT_CUSTOM_ROLES.map(function (r) { return Object.assign({ core: false }, r); });
  }

  function getAllRoles(settingsObj, includeSuperadmin) {
    const cores = CORE_ROLES.filter(function (r) { return includeSuperadmin || r.code !== 'superadmin'; });
    return cores.concat(parseCustomRoles(settingsObj));
  }

  function getRoleMeta(roleCode, settingsObj) {
    const code = String(roleCode || 'warga').trim().toLowerCase();
    const all = getAllRoles(settingsObj, true);
    for (let i = 0; i < all.length; i++) {
      if (all[i].code === code) return all[i];
    }
    return { code: code, label: roleCode || 'Warga RT', base_role: 'warga', color: 'blue-grey-7', core: false };
  }

  function getEffectiveRole(user, settingsObj) {
    if (!user) return 'warga';
    const r = String(user.role || 'warga').trim().toLowerCase();
    if (r === 'superadmin' || r === 'admin' || r === 'bendahara' || r === 'warga') return r;
    if (settingsObj && settingsObj.custom_roles_json) {
      return getRoleMeta(r, settingsObj).base_role || 'warga';
    }
    if (user.base_role) return String(user.base_role).trim().toLowerCase();
    return getRoleMeta(r, settingsObj).base_role || 'warga';
  }

  function isAdminRole(user, settingsObj) {
    const eff = getEffectiveRole(user, settingsObj);
    return eff === 'superadmin' || eff === 'admin';
  }

  function isFinanceStaff(user, settingsObj) {
    const eff = getEffectiveRole(user, settingsObj);
    return eff === 'superadmin' || eff === 'admin' || eff === 'bendahara';
  }

  function isWargaRole(user, settingsObj) {
    return getEffectiveRole(user, settingsObj) === 'warga';
  }

  function canAccessMenu(menuKey, user, settingsObj) {
    const cfg = parseMenuConfig(settingsObj);
    const item = cfg[menuKey];
    if (!item) return true;
    if (!item.enabled) return false;
    if (!user) return false;
    if (user.role === 'superadmin') return true;
    if (Array.isArray(item.roles) && item.roles.indexOf(user.role) !== -1) return true;
    if (Array.isArray(item.denied_roles) && item.denied_roles.indexOf(user.role) !== -1) return false;
    const eff = getEffectiveRole(user, settingsObj);
    return Array.isArray(item.roles) && item.roles.indexOf(eff) !== -1;
  }

              atas_nama: String(a.atas_nama || '').trim(),
              aktif: a.aktif !== false
            };
          });
        }
      }
    } catch (e) {}
    if (s.bank_nama || s.bank_norek) {
      return [{

        norek: String(s.bank_norek || '').trim(),
        atas_nama: String(s.bank_atas_nama || '').trim(),
        aktif: true
      }];
    }
    return [];
  }

  function formatBankInfoClient(settingsObj) {
    const active = parseBankAccounts(settingsObj).filter(function (a) { return a.aktif !== false && (a.bank || a.norek); });

      const a = active[0];
      return a.bank + ' ' + a.norek + (a.atas_nama ? (' a.n. ' + a.atas_nama) : '');
    }
    return active.map(function (a) {
      return '• ' + a.bank + ': ' + a.norek + (a.atas_nama ? (' (a.n. ' + a.atas_nama + ')') : '');
    }).join('\n');
  }

  function mockComputeBukuKas(db, filters) {
    const reqPeriode = (filters && filters.periode) ? String(filters.periode).trim() : '';
    let startDate = (filters && filters.startDate) || '';
    let endDate = (filters && filters.endDate) || '';
    if (/^\d{4}-\d{2}$/.test(reqPeriode)) {
      const p = reqPeriode.split('-');
      const lastD = new Date(parseInt(p[0], 10), parseInt(p[1], 10), 0).getDate();
      startDate = reqPeriode + '-01';
      endDate = reqPeriode + '-' + (lastD < 10 ? '0' + lastD : String(lastD));
    }

    const saldoAwalDasar = Number(db.settings.saldo_awal_kas || 0);
    let totalMasukRiil = 0, totalKeluarRiil = 0;
    db.kas.forEach(function (tx) {
      if (tx.tipe === 'Masuk') totalMasukRiil += Number(tx.nominal || 0);
      else totalKeluarRiil += Number(tx.nominal || 0);
    });
    const saldoKasRiil = saldoAwalDasar + totalMasukRiil - totalKeluarRiil;

    // Alokasikan rapel per bulan periode IPL di mock mode juga
    const allocated = [];
    db.kas.forEach(function (tx) {
      const nom = Number(tx.nominal || 0);
      if (tx.tipe === 'Masuk') {
        const linked = (db.tagihan || []).filter(function (t) {
          return String(t.status) === 'Lunas' && (
            (t.kas_id && t.kas_id === tx.id) ||
            (tx.referensi_id && ((t.batch_id && t.batch_id === tx.referensi_id) || t.id === tx.referensi_id))
          );
        });
        const sumL = linked.reduce(function (s, t) { return s + Number(t.total || t.nominal || 0); }, 0);
        if (linked.length >= 1 && sumL === nom) {
          const payYm = String(tx.tanggal || '').substring(0, 7);
          linked.sort(function (a, b) { return String(a.periode).localeCompare(String(b.periode)); }).forEach(function (t, idx) {
            const tYm = String(t.periode || '').substring(0, 7);
            const effDate = tYm === payYm ? tx.tanggal : (tYm + '-01');
            const desc = linked.length > 1
              ? ('Pembayaran IPL ' + formatPeriodeID(tYm) + (tYm !== payYm ? (' (Rapel · dibayar ' + formatDateID(tx.tanggal) + ')') : ' (Rapel)') + ' - Rumah ' + t.no_rumah + ' (' + t.kepala_keluarga + ')')
              : tx.deskripsi;
            allocated.push(Object.assign({}, tx, { id: tx.id + '_' + tYm + '_' + idx, tanggal: effDate, nominal: Number(t.total || t.nominal || 0), deskripsi: desc }));
          });
          return;
        }
      }
      allocated.push(tx);
    });

    const allKas = allocated.sort(function (a, b) {
      return String(a.tanggal).localeCompare(String(b.tanggal)) || String(a.created_at).localeCompare(String(b.created_at));
    });
    let saldoAwalPeriode = saldoAwalDasar;
    let totalMasuk = 0;
    let totalKeluar = 0;
    let deferredFutureTotal = 0;
    let deferredFutureCount = 0;
    const deferredPeriodsSet = {};
    const ledger = [];
    const perKategoriMasuk = {};
    const perKategoriKeluar = {};

    allKas.forEach(function (tx) {
      const isMasuk = tx.tipe === 'Masuk';
      const nom = Number(tx.nominal || 0);
      const delta = isMasuk ? nom : -nom;
      if (startDate && tx.tanggal < startDate) { saldoAwalPeriode += delta; return; }
      if (endDate && tx.tanggal > endDate) {
        if (isMasuk) {
          deferredFutureTotal += nom;
          deferredFutureCount++;
          const ymF = String(tx.tanggal || '').substring(0, 7);
          if (/^\d{4}-\d{2}$/.test(ymF)) deferredPeriodsSet[ymF] = true;
        }
        return;
      }
      if (isMasuk) { totalMasuk += nom; perKategoriMasuk[tx.kategori] = (perKategoriMasuk[tx.kategori] || 0) + nom; }
      else { totalKeluar += nom; perKategoriKeluar[tx.kategori] = (perKategoriKeluar[tx.kategori] || 0) + nom; }
      const prev = ledger.length ? ledger[ledger.length - 1].saldo_berjalan : saldoAwalPeriode;
      ledger.push(Object.assign({}, tx, { debit: isMasuk ? nom : 0, kredit: !isMasuk ? nom : 0, saldo_berjalan: prev + delta }));
    });

    const mMap = {};
    allKas.forEach(function (tx) {
      const ym = String(tx.tanggal || '').substring(0, 7);
      if (!/^\d{4}-\d{2}$/.test(ym)) return;
      if (!mMap[ym]) mMap[ym] = { periode: ym, masuk: 0, keluar: 0 };
      if (tx.tipe === 'Masuk') mMap[ym].masuk += Number(tx.nominal || 0);
      else mMap[ym].keluar += Number(tx.nominal || 0);
    });
    const sortedM = Object.keys(mMap).sort();
    let runS = saldoAwalDasar;
    const monthlyRecapAsc = sortedM.map(function (k) {
      const m = mMap[k];
      runS += (m.masuk - m.keluar);
      return { periode: m.periode, masuk: m.masuk, keluar: m.keluar, selisih: m.masuk - m.keluar, saldo_akhir: runS };
    });
    const curYm = currentPeriodeClient();
    const upToCur = sortedM.filter(function (k) { return k <= curYm; });
    const monthlySeries = (upToCur.length ? upToCur.slice(-6) : sortedM.slice(-6)).map(function (k) { return mMap[k]; });
    return {
      periode: /^\d{4}-\d{2}$/.test(reqPeriode) ? reqPeriode : '',
      startDate: startDate,
      endDate: endDate,
      saldoAwalPeriode: saldoAwalPeriode,
      totalMasuk: totalMasuk,
      totalKeluar: totalKeluar,
      surplusDefisit: totalMasuk - totalKeluar,
      saldoAkhir: saldoAwalPeriode + totalMasuk - totalKeluar,
      saldoKasRiil: saldoKasRiil,
      deferredFutureTotal: deferredFutureTotal,
      deferredFutureCount: deferredFutureCount,
      deferredFuturePeriods: Object.keys(deferredPeriodsSet).sort(),
      ledger: ledger,
      perKategoriMasuk: perKategoriMasuk,
      perKategoriKeluar: perKategoriKeluar,
      monthlySeries: monthlySeries,
      monthlyRecap: monthlyRecapAsc.slice().reverse()
    };
  }

        if (!buktiUrl && metode !== 'Tunai' && !directApprove) {
          throw new Error('Silakan lampirkan foto/PDF bukti pembayaran.');
        }
        const payable = [];
        const skippedLunas = [];
        periods.forEach(function (ym) {
          const ex = db.tagihan.find(function (x) { return String(x.kk_id) === targetKkId && String(x.periode) === ym; });
          if (ex && ex.status === 'Lunas') skippedLunas.push(ym);
          else payable.push({ ym: ym, ex: ex });
        });
        if (!payable.length) throw new Error('Semua bulan pada rentang tersebut sudah berstatus Lunas.');
        const batchId = mockId('RPL');
        const rangeText = formatPeriodsSummary(payable.map(function (p) { return p.ym; }), true);
        let grandTotal = 0;
        payable.forEach(function (p) { grandTotal += p.ex ? Number(p.ex.total || p.ex.nominal || nomBulan) : nomBulan; });
        let kasId = '';
        if (directApprove) {
          const rekSuffix = rekTujuan ? (' [' + rekTujuan + ']') : '';
          const kasObj = {
            id: mockId('KAS'), tanggal: today, tipe: 'Masuk', kategori: 'IPL Bulanan',
            deskripsi: 'Pembayaran IPL Rapel ' + rangeText + ' - Rumah ' + kk.no_rumah + ' (' + kk.kepala_keluarga + ')' + rekSuffix,
            nominal: grandTotal, metode: metode, referensi_id: batchId, bukti_url: buktiUrl, dicatat_oleh: u.nama, created_at: now
          };
          db.kas.unshift(kasObj);
          kasId = kasObj.id;
        }
        const targetStatus = directApprove ? 'Lunas' : 'Menunggu Verifikasi';
        const catWarga = String(payload.catatan_warga || ('Pembayaran IPL Rapel ' + rangeText)).trim();
        payable.forEach(function (p) {
          if (p.ex) {
            p.ex.status = targetStatus;
            p.ex.metode_bayar = metode;
            p.ex.rekening_tujuan = rekTujuan;
            if (buktiUrl) p.ex.bukti_url = buktiUrl;
            p.ex.tanggal_upload = today;
            p.ex.catatan_warga = catWarga;
            p.ex.diverifikasi_oleh = directApprove ? u.nama : '';
            p.ex.tanggal_verifikasi = directApprove ? today : '';
            p.ex.catatan_bendahara = directApprove ? ('Pelunasan rapel ' + rangeText) : '';
            p.ex.kas_id = kasId;
            p.ex.batch_id = batchId;
          } else {
            db.tagihan.push({
              id: mockId('IPL'), periode: p.ym, kk_id: kk.id, no_rumah: kk.no_rumah, kepala_keluarga: kk.kepala_keluarga,
              nominal: nomBulan, denda: 0, total: nomBulan, status: targetStatus, tanggal_jatuh_tempo: p.ym + '-10',
              metode_bayar: metode, rekening_tujuan: rekTujuan, bukti_url: buktiUrl, tanggal_upload: today,
              catatan_warga: catWarga, diverifikasi_oleh: directApprove ? u.nama : '',
              tanggal_verifikasi: directApprove ? today : '', catatan_bendahara: directApprove ? ('Pelunasan rapel ' + rangeText) : '',
              kas_id: kasId, batch_id: batchId, created_at: now
            });
          }
        });
        saveMockDb(db);
        return {
          batch_id: batchId, count: payable.length, skippedLunas: skippedLunas, grandTotal: grandTotal, status: targetStatus,
          message: directApprove
            ? ('Pelunasan rapel ' + rangeText + ' (' + formatRupiah(grandTotal) + ') dicatat Lunas & masuk Buku Kas!')
            : ('Bukti rapel ' + rangeText + ' (' + formatRupiah(grandTotal) + ') berhasil dikirim untuk verifikasi.')
        };
      }
      case 'verifyIplPayment': {
        const u = needAuth(['admin', 'bendahara']);
        const batchId = String(payload.batch_id || '').trim();
        const t = payload.tagihan_id
          ? db.tagihan.find(function (x) { return x.id === payload.tagihan_id; })
          : db.tagihan.find(function (x) { return batchId && x.batch_id === batchId; });
        if (!t) throw new Error('Tagihan tidak ditemukan.');
        if (payload.action === 'approve') {
          const targets = batchId
            ? db.tagihan.filter(function (x) { return x.batch_id === batchId && x.status === 'Menunggu Verifikasi'; })
            : [t];
          targets.sort(function (a, b) { return String(a.periode).localeCompare(String(b.periode)); });
          let grandTotal = 0;
          targets.forEach(function (x) { grandTotal += Number(x.total || x.nominal || 0); });
          const first = targets[0];
          const rekSuffix = first.rekening_tujuan ? (' [' + first.rekening_tujuan + ']') : '';
          const desk = targets.length > 1
            ? ('Pembayaran IPL Rapel ' + formatPeriodsSummary(targets.map(function (x) { return x.periode; }), true) + ' - Rumah ' + first.no_rumah + ' (' + first.kepala_keluarga + ')' + rekSuffix)
            : ('Pembayaran IPL ' + formatPeriodeID(first.periode) + ' - Rumah ' + first.no_rumah + ' (' + first.kepala_keluarga + ')' + rekSuffix);
          const kasObj = {
            id: mockId('KAS'), tanggal: today, tipe: 'Masuk', kategori: 'IPL Bulanan',
            deskripsi: desk, nominal: grandTotal, metode: first.metode_bayar || 'Transfer Bank',
            referensi_id: targets.length > 1 ? batchId : first.id, bukti_url: first.bukti_url || '', dicatat_oleh: u.nama, created_at: now
          };
          db.kas.unshift(kasObj);
          targets.forEach(function (x) {
            x.status = 'Lunas';
            x.diverifikasi_oleh = u.nama;
            x.tanggal_verifikasi = today;
            x.catatan_bendahara = payload.catatan_bendahara || 'Pembayaran terverifikasi';
            x.kas_id = kasObj.id;
          });
          saveMockDb(db);
          return { tagihan: targets[0], updatedCount: targets.length, kas: kasObj };
        } else if (payload.action === 'revert') {
          const cfg = parseMenuConfig(db.settings);
          const allowedRev = (cfg._permissions && cfg._permissions.verif_revisi_roles) || ['superadmin', 'admin', 'bendahara'];
          if (u.role !== 'superadmin' && allowedRev.indexOf(u.role) === -1) {
            throw new Error('Peran Anda (' + u.role + ') tidak memiliki izin untuk merevisi verifikasi.');
          }
          if (!payload.catatan_bendahara) throw new Error('Alasan revisi wajib diisi.');
          const effBatch = batchId || t.batch_id || '';
          const targets = (effBatch && db.tagihan.filter(function (x) { return x.batch_id === effBatch && x.status === t.status; }).length > 1)
            ? db.tagihan.filter(function (x) { return x.batch_id === effBatch && x.status === t.status; })
            : [t];
          let revertedKasId = '';
          if (t.status === 'Lunas') {
            targets.forEach(function (x) {
              if (x.kas_id) {
                db.kas = db.kas.filter(function (k) { return k.id !== x.kas_id; });
                revertedKasId = x.kas_id;
              }
            });
          }
          const prevStatus = t.status;
          targets.forEach(function (x) {
            x.status = payload.target_status === 'Belum Bayar' ? 'Belum Bayar' : 'Menunggu Verifikasi';
            x.diverifikasi_oleh = '';
            x.tanggal_verifikasi = '';
            x.kas_id = '';
            x.catatan_bendahara = '[Revisi dari ' + prevStatus + ' oleh ' + u.nama + ']: ' + payload.catatan_bendahara;
          });
          saveMockDb(db);
          return { tagihan: targets[0], updatedCount: targets.length, revertedKasId: revertedKasId };
        } else {
          if (!payload.catatan_bendahara) throw new Error('Alasan penolakan wajib diisi.');
          const targets = batchId
            ? db.tagihan.filter(function (x) { return x.batch_id === batchId && x.status === 'Menunggu Verifikasi'; })
            : [t];
          targets.forEach(function (x) {
            x.status = 'Ditolak';
            x.diverifikasi_oleh = u.nama;
            x.tanggal_verifikasi = today;
            x.catatan_bendahara = payload.catatan_bendahara;
          });
          saveMockDb(db);
          return { tagihan: targets[0], updatedCount: targets.length };
        }
      }
      case 'getKasList':
        needAuth();
        return db.kas.slice().sort(function (a, b) { return String(b.tanggal).localeCompare(String(a.tanggal)); });
      case 'getKategoriKas':
        needAuth();
        return (db.kategoriKas || []).slice().sort(function (a, b) {
          return String(a.tipe).localeCompare(String(b.tipe)) || String(a.nama).localeCompare(String(b.nama));
        });
      case 'saveKategoriKas': {
        needAuth(['admin', 'bendahara']);
        const tipe = payload.tipe === 'Masuk' ? 'Masuk' : 'Keluar';
        const nama = String(payload.nama || '').trim();
        const keterangan = String(payload.keterangan || '').trim();
        const status = payload.status === 'Nonaktif' ? 'Nonaktif' : 'Aktif';
        if (!nama) throw new Error('Nama kategori pos anggaran wajib diisi.');
        const dup = (db.kategoriKas || []).find(function (k) {
          return k.tipe === tipe && k.nama.toLowerCase() === nama.toLowerCase() && k.id !== payload.id;
        });
        if (dup) throw new Error('Kategori "' + nama + '" untuk Kas ' + tipe + ' sudah ada.');
        if (payload.id) {
          const i = db.kategoriKas.findIndex(function (k) { return k.id === payload.id; });
          if (i >= 0) {
            Object.assign(db.kategoriKas[i], { tipe: tipe, nama: nama, keterangan: keterangan, status: status });
            saveMockDb(db);
            return db.kategoriKas[i];
          }
        }
        const obj = { id: mockId('KAT'), tipe: tipe, nama: nama, keterangan: keterangan, status: status, created_at: now };
        db.kategoriKas.push(obj);
        saveMockDb(db);
        return obj;
      }
      case 'toggleKategoriKas': {
        needAuth(['admin', 'bendahara']);
        const item = (db.kategoriKas || []).find(function (k) { return k.id === payload.id; });
        if (!item) throw new Error('Kategori tidak ditemukan.');
        item.status = payload.status
          ? (payload.status === 'Nonaktif' ? 'Nonaktif' : 'Aktif')
          : (item.status === 'Aktif' ? 'Nonaktif' : 'Aktif');
        saveMockDb(db);
        return item;
      }
      case 'saveKasTransaction': {
        const u = needAuth(['admin', 'bendahara']);
        const buktiUrl = payload.filePayload ? payload.filePayload.base64Data : (payload.bukti_url || '');
        if (payload.id) {
          const i = db.kas.findIndex(function (k) { return k.id === payload.id; });
          if (i >= 0) { Object.assign(db.kas[i], payload, { nominal: Number(payload.nominal), bukti_url: buktiUrl }); saveMockDb(db); return db.kas[i]; }
        }
        const obj = {
          id: mockId('KAS'), tanggal: payload.tanggal, tipe: payload.tipe, kategori: payload.kategori,
          deskripsi: payload.deskripsi, nominal: Number(payload.nominal), metode: payload.metode || 'Tunai',
          referensi_id: '', bukti_url: buktiUrl, dicatat_oleh: u.nama, created_at: now
        };
        db.kas.unshift(obj);
        saveMockDb(db);
        return obj;
      }
      case 'deleteKasTransaction': {
        needAuth(['admin', 'bendahara']);
        const target = db.kas.find(function (k) { return k.id === payload.id; });
        if (target && target.referensi_id && target.referensi_id.indexOf('IPL-') === 0) {
          throw new Error('Transaksi berasal dari verifikasi IPL otomatis dan tidak dapat dihapus langsung.');
        }
        db.kas = db.kas.filter(function (k) { return k.id !== payload.id; });
        saveMockDb(db);
        return { deleted: true };
      }
      case 'getBukuKasReport':
        needAuth();
        return mockComputeBukuKas(db, payload);
      case 'getWaLogList':
        needAuth(['admin', 'bendahara']);
        return (db.waLogs || []).slice();
      case 'testWhatsapp': {
        const u = needAuth(['admin']);
        const phone = String((payload && payload.phone) || '').replace(/[^0-9]/g, '');
        if (!phone || phone.length < 9) throw new Error('Nomor WhatsApp tujuan tidak valid.');
        const norm = phone.startsWith('0') ? '62' + phone.slice(1) : phone;
        const prov = (payload && payload.overrideSettings && payload.overrideSettings.wa_provider) || db.settings.wa_provider || 'fonnte';
        db.waLogs.unshift({
          id: mockId('WA'), tanggal: now, periode: currentPeriodeClient(), tagihan_id: 'TEST',
          no_rumah: 'ADMIN', nama_warga: 'Uji Koneksi WA', no_hp: norm,
          pesan: (payload && payload.message) || 'Pesan uji coba SIWARGA Perumahan GKA',
          provider: prov, status: 'Terkirim', response_msg: 'Simulasi Preview Lokal OK (200)', dikirim_oleh: u.nama
        });
        saveMockDb(db);
        return { sent: true, target: norm, response: 'Simulasi Preview Lokal OK' };
      }
      case 'sendIplReminderSingle': {
        const u = needAuth(['admin', 'bendahara']);
        const t = db.tagihan.find(function (x) { return x.id === payload.tagihan_id; });
        if (!t) throw new Error('Tagihan tidak ditemukan.');
        const kk = db.keluarga.find(function (k) { return k.id === t.kk_id; }) || {};
        const phone = String(payload.phone || kk.no_hp || '').replace(/[^0-9]/g, '');
        if (!phone) throw new Error('Nomor HP rumah ' + t.no_rumah + ' belum diisi.');
        const norm = phone.startsWith('0') ? '62' + phone.slice(1) : phone;
        const msg = payload.custom_message || ('Pengingat IPL ' + t.periode + ' Rumah ' + t.no_rumah + ' sebesar ' + formatRupiah(t.total || t.nominal));
        db.waLogs.unshift({
          id: mockId('WA'), tanggal: now, periode: t.periode, tagihan_id: t.id,
          no_rumah: t.no_rumah, nama_warga: t.kepala_keluarga, no_hp: norm,
          pesan: msg, provider: db.settings.wa_provider || 'fonnte',
          status: 'Terkirim', response_msg: 'Simulasi Preview Lokal OK (200)', dikirim_oleh: u.nama
        });
        saveMockDb(db);
        return { sent: true, no_rumah: t.no_rumah, nama: t.kepala_keluarga, target: norm };
      }
      case 'sendIplReminderBulk': {
        const u = needAuth(['admin', 'bendahara']);
        const ids = Array.isArray(payload && payload.tagihan_ids) && payload.tagihan_ids.length ? payload.tagihan_ids : null;
        const per = (payload && payload.periode) || currentPeriodeClient();
        const targets = db.tagihan.filter(function (t) {
          if (t.status !== 'Belum Bayar' && t.status !== 'Ditolak') return false;
          if (ids) return ids.indexOf(t.id) !== -1;
          return t.periode === per;
        });
        if (!targets.length) throw new Error('Tidak ada tagihan belum bayar untuk dikirimi pengingat.');
        let sent = 0, skippedNoPhone = 0;
        const details = [];
        targets.forEach(function (t) {
          const kk = db.keluarga.find(function (k) { return k.id === t.kk_id; }) || {};
          const phone = String(kk.no_hp || '').replace(/[^0-9]/g, '');
          if (!phone) {
            skippedNoPhone++;
            details.push({ no_rumah: t.no_rumah, nama: t.kepala_keluarga, status: 'Dilewati (No. HP kosong)' });
            return;
          }
          const norm = phone.startsWith('0') ? '62' + phone.slice(1) : phone;
          db.waLogs.unshift({
            id: mockId('WA'), tanggal: now, periode: t.periode, tagihan_id: t.id,
            no_rumah: t.no_rumah, nama_warga: t.kepala_keluarga, no_hp: norm,
            pesan: 'Pengingat IPL ' + t.periode + ' Rumah ' + t.no_rumah + ' sebesar ' + formatRupiah(t.total || t.nominal),
            provider: db.settings.wa_provider || 'fonnte',
            status: 'Terkirim', response_msg: 'Simulasi Preview Lokal OK (200)', dikirim_oleh: u.nama
          });
          sent++;
          details.push({ no_rumah: t.no_rumah, nama: t.kepala_keluarga, status: 'Terkirim' });
        });
        saveMockDb(db);
        return { total: targets.length, sent: sent, failed: 0, skippedNoPhone: skippedNoPhone, details: details, message: 'Selesai (Simulasi): ' + sent + ' terkirim, 0 gagal, ' + skippedNoPhone + ' tanpa nomor HP.' };
      }
      default:
        throw new Error('Aksi tidak dikenali: ' + action);
    }
  }

  window.SiwargaAPI = {
    isMockMode: !isGasEnv && !getRemoteApiUrl(),
    isRemoteApiMode: !isGasEnv && !!getRemoteApiUrl(),
    DEFAULT_MENU_CONFIG: DEFAULT_MENU_CONFIG,
    CORE_ROLES: CORE_ROLES,
    DEFAULT_CUSTOM_ROLES: DEFAULT_CUSTOM_ROLES,
    parseMenuConfig: parseMenuConfig,
    parseCustomRoles: parseCustomRoles,
    getAllRoles: getAllRoles,
    getRoleMeta: getRoleMeta,
    getEffectiveRole: getEffectiveRole,
    isAdminRole: isAdminRole,
    isFinanceStaff: isFinanceStaff,
    isWargaRole: isWargaRole,
    canAccessMenu: canAccessMenu,
    parseBankAccounts: parseBankAccounts,
    formatBankInfo: formatBankInfoClient,
    getToken: function () { return localStorage.getItem(TOKEN_KEY) || ''; },
    setToken: function (t) {
      if (t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    },
    formatRupiah: formatRupiah,
    formatDateID: formatDateID,
    formatDateTimeID: formatDateTimeID,
    formatPeriodeID: formatPeriodeID,
    buildPeriodeOptions: buildPeriodeOptions,
    expandPeriodeRange: expandPeriodeRange,
    formatPeriodsSummary: formatPeriodsSummary,
    currentPeriode: currentPeriodeClient,
    readFileAsPayload: readFileAsPayload,
    call: function (action, payload) {
      const token = localStorage.getItem(TOKEN_KEY) || '';
      if (isGasEnv) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(function (res) {
              if (res && res.ok) resolve(res.data);
              else reject(new Error((res && res.error) || 'Terjadi kesalahan pada server Google Apps Script.'));
            })
            .withFailureHandler(function (err) {
              reject(new Error((err && err.message) || 'Koneksi ke Google Apps Script gagal.'));
            })
            .apiCall(action, token, payload || {});
        });
      }
      const remoteUrl = getRemoteApiUrl();
      if (remoteUrl) {
        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = controller ? setTimeout(function () { controller.abort(); }, 60000) : null;
        return fetch(remoteUrl, {
          method: 'POST',
          redirect: 'follow',
          credentials: 'omit',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, token: token, payload: payload || {} }),
          signal: controller ? controller.signal : undefined
        })
          .then(function (resp) {
            if (timer) clearTimeout(timer);
            return resp.text().then(function (text) {
              let res;
              try {
                res = JSON.parse(text);
              } catch (e) {
                throw new Error('Server API Apps Script belum merespons JSON. Pastikan sudah Deploy → Manage deployments → Edit → New version (Who has access: Anyone).');
              }
              if (res && res.ok) return res.data;
              throw new Error((res && res.error) || 'Terjadi kesalahan pada server Google Apps Script.');
            });
          })
          .catch(function (err) {
            if (timer) clearTimeout(timer);
            if (err && err.name === 'AbortError') {
              throw new Error('Koneksi ke server melebihi batas waktu (timeout). Silakan coba lagi.');
            }
            throw err;
          });
      }
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          try {
            const data = mockDispatch(action, token, payload || {});
            resolve(data);
          } catch (err) {
            reject(err);
          }
        }, 120);
      });
    }
  };
})();
</script>

                </q-item-section>

  setup(props, { emit }) {
    const { ref, reactive, computed, onMounted, onBeforeUnmount, nextTick } = Vue;
    const $q = Quasar.useQuasar();
    const loading = ref(false);
    const unpaidDialog = ref(false);
    const kasChartCanvas = ref(null);
    let chartInstance = null;

    const dashboard = reactive({
      periode: '',
      latestPengumuman: [],
      upcomingKegiatan: [],
      myUnpaidIpl: [],
      monthlySeries: []
    });
    const stats = reactive({
      totalKK: 0, totalWarga: 0, suratPending: 0, pengaduanAktif: 0,
      iplPendingVerif: 0, iplTotalBulanIni: 0, iplLunasBulanIni: 0, iplPersenLunas: 0,
      saldoKas: 0, totalMasuk: 0, totalKeluar: 0
    });

    function renderChart(series) {
      if (!kasChartCanvas.value || typeof Chart === 'undefined') return;
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }
      const labels = (series && series.length)
        ? series.map(s => SiwargaAPI.formatPeriodeID(s.periode))
        : [SiwargaAPI.formatPeriodeID(SiwargaAPI.currentPeriode())];
      const masuk = (series && series.length) ? series.map(s => s.masuk) : [0];
      const keluar = (series && series.length) ? series.map(s => s.keluar) : [0];

      chartInstance = new Chart(kasChartCanvas.value.getContext('2d'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'Kas Masuk', data: masuk, backgroundColor: '#0f766e', borderRadius: 6 },
            { label: 'Kas Keluar', data: keluar, backgroundColor: '#f97316', borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function (v) { return 'Rp ' + (v / 1000) + 'rb'; }
              }
            }
          }
        }
      });
    }

    async function loadDashboard() {
      loading.value = true;
      try {
        const res = await SiwargaAPI.call('getDashboard');
        Object.assign(stats, res.stats || {});
        dashboard.periode = res.periode;
        dashboard.latestPengumuman = res.latestPengumuman || [];
        dashboard.upcomingKegiatan = res.upcomingKegiatan || [];
        dashboard.myUnpaidIpl = res.myUnpaidIpl || [];
        dashboard.monthlySeries = res.monthlySeries || [];
        emit('update-badges', { pendingVerif: stats.iplPendingVerif });
        await nextTick();
        renderChart(dashboard.monthlySeries);
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loading.value = false;
      }
    }

    function canSee(menuKey) {
      return SiwargaAPI.canAccessMenu(menuKey, props.user, props.settings);
    }

    const activeBankAccounts = computed(() =>
      SiwargaAPI.parseBankAccounts(props.settings).filter(a => a.aktif !== false && (a.bank || a.norek))
    );

    const myUnpaidTotal = computed(() =>
      (dashboard.myUnpaidIpl || []).reduce((sum, b) => sum + Number(b.total || b.nominal || 0), 0)
    );

    function copyRekening(norek, bankName) {
      const txt = norek || (activeBankAccounts.value[0] && activeBankAccounts.value[0].norek) || (props.settings && props.settings.bank_norek) || '';
      if (navigator.clipboard && txt) {
        navigator.clipboard.writeText(txt);
        $q.notify({ type: 'positive', message: 'Nomor rekening ' + (bankName ? bankName + ' ' : '') + 'disalin: ' + txt });
      }
    }

    function goPayBill(bill) {
      unpaidDialog.value = false;
      emit('pay-bill', bill.id);
    }

    function goAllIpl() {
      unpaidDialog.value = false;
      emit('navigate', 'finance_ipl');
    }

    function menuLabel(menuKey) {
      const cfg = SiwargaAPI.parseMenuConfig(props.settings);
      return (cfg[menuKey] && cfg[menuKey].label) || menuKey;
    }

    function goActionCard() {
      if (SiwargaAPI.isWargaRole(props.user, props.settings)) {
        if (canSee('surat')) emit('navigate', 'surat');
        else if (canSee('finance_ipl')) emit('navigate', 'finance_ipl');
      } else {
        if (canSee('finance_verif')) emit('navigate', 'finance_verif');
        else if (canSee('finance_ipl')) emit('navigate', 'finance_ipl');
      }
    }

    const nowHour = ref(new Date().getHours());
    let greetTimer = null;
    const dashGreetingText = computed(() => {
      const h = nowHour.value;
      if (h >= 4 && h < 11) return 'Selamat Pagi';
      if (h >= 11 && h < 15) return 'Selamat Siang';
      if (h >= 15 && h < 18) return 'Selamat Sore';
      return 'Selamat Malam';
    });
    const dashGreetingIcon = computed(() => {
      const h = nowHour.value;
      if (h >= 4 && h < 11) return 'wb_twilight';
      if (h >= 11 && h < 15) return 'wb_sunny';
      if (h >= 15 && h < 18) return 'wb_twilight';
      return 'nights_stay';
    });

    onMounted(() => {
      loadDashboard();
      greetTimer = setInterval(() => { nowHour.value = new Date().getHours(); }, 30000);
    });
    onBeforeUnmount(() => {
      if (greetTimer) clearInterval(greetTimer);
      if (chartInstance) chartInstance.destroy();
    });

    return {
      loading, unpaidDialog, dashboard, stats, activeBankAccounts, myUnpaidTotal, kasChartCanvas, canSee, menuLabel, goActionCard,
      dashGreetingText, dashGreetingIcon,
      copyRekening, goPayBill, goAllIpl,
      formatRupiah: SiwargaAPI.formatRupiah,
      formatDateID: SiwargaAPI.formatDateID,
      formatPeriodeID: SiwargaAPI.formatPeriodeID
    };
  }
};
</script>

                    map-options
                    outlined dense
                    label="Kartu Keluarga / No. Rumah *"

                    :rules="[v=>!!v||'Wajib']"
                  />

                <div class="col-12 col-sm-6"><q-input v-model="wargaForm.tanggal_lahir" type="date" outlined dense label="Tanggal Lahir" /></div>

                <div class="col-12 col-sm-4"><q-select v-model="wargaForm.agama" :options="['Islam', 'Kristen', 'Katolik', 'Hindu', 'Buddha', 'Konghucu']" outlined dense label="Agama" /></div>
                <div class="col-12 col-sm-4"><q-select v-model="wargaForm.status_perkawinan" :options="['Belum Kawin', 'Kawin', 'Cerai Hidup', 'Cerai Mati']" outlined dense label="Status Kawin" /></div>

                <div class="col-12 col-sm-3"><q-input v-model="wargaForm.no_hp" outlined dense label="No. HP" /></div>
                <div class="col-12 col-sm-3"><q-select v-model="wargaForm.status_warga" :options="['Aktif', 'Pindah', 'Meninggal']" outlined dense label="Status" /></div>

  setup(props) {
    const { ref, reactive, computed, onMounted } = Vue;
    const $q = Quasar.useQuasar();

    const isAdmin = computed(() => SiwargaAPI.isAdminRole(props.user, props.settings));
    const isWarga = computed(() => SiwargaAPI.isWargaRole(props.user, props.settings));
    const tab = ref('kk');
    const loading = ref(false);
    const saving = ref(false);
    const keluargaList = ref([]);
    const wargaList = ref([]);
    const searchKk = ref('');
    const filterHunian = ref('Semua');
    const searchWarga = ref('');
    const filterStatusWarga = ref('Semua');

    const detailDialog = ref(false);
    const selectedKk = ref({});
    const kkDialog = ref(false);
    const kkForm = reactive({});
    const wargaDialog = ref(false);
    const wargaForm = reactive({});

    const kkColumns = [
      { name: 'no_rumah', label: 'Rumah', field: 'no_rumah', align: 'left', sortable: true },
      { name: 'kepala_keluarga', label: 'Kepala Keluarga', field: 'kepala_keluarga', align: 'left', sortable: true },
      { name: 'no_kk', label: 'No. KK', field: 'no_kk', align: 'left' },
      { name: 'status_hunian', label: 'Hunian', field: 'status_hunian', align: 'center' },
      { name: 'jumlah_anggota', label: 'Anggota', field: 'jumlah_anggota', align: 'center', sortable: true },
      { name: 'no_hp', label: 'HP / WA', field: 'no_hp', align: 'left' },
      { name: 'nominal_ipl', label: 'Tarif IPL', field: 'nominal_ipl', align: 'right', sortable: true },
      { name: 'actions', label: 'Aksi', field: 'id', align: 'right' }
    ];

    const wargaColumns = [
      { name: 'no_rumah', label: 'Rumah', field: 'no_rumah', align: 'left', sortable: true },
      { name: 'nama_lengkap', label: 'Nama Lengkap', field: 'nama_lengkap', align: 'left', sortable: true },
      { name: 'nik', label: 'NIK', field: 'nik', align: 'left' },
      { name: 'hubungan_keluarga', label: 'Hubungan', field: 'hubungan_keluarga', align: 'left' },
      { name: 'jenis_kelamin', label: 'L/P', field: 'jenis_kelamin', align: 'center' },
      { name: 'pekerjaan', label: 'Pekerjaan', field: 'pekerjaan', align: 'left' },
      { name: 'status_warga', label: 'Status', field: 'status_warga', align: 'center' },
      { name: 'actions', label: 'Aksi', field: 'id', align: 'right' }
    ];

    const filteredKk = computed(() => {
      const q = (searchKk.value || '').toLowerCase();
      return keluargaList.value.filter(k => {
        if (filterHunian.value !== 'Semua' && k.status_hunian !== filterHunian.value) return false;
        if (!q) return true;
        return [k.no_rumah, k.kepala_keluarga, k.no_kk, k.alamat].some(v => String(v || '').toLowerCase().includes(q));
      });
    });

    const filteredWarga = computed(() => {
      const q = (searchWarga.value || '').toLowerCase();
      return wargaList.value.filter(w => {
        if (filterStatusWarga.value !== 'Semua' && w.status_warga !== filterStatusWarga.value) return false;
        if (!q) return true;
        return [w.nama_lengkap, w.nik, w.no_rumah, w.pekerjaan].some(v => String(v || '').toLowerCase().includes(q));
      });
    });

    const kkSelectOptions = computed(() => keluargaList.value.map(k => ({
      value: k.id, label: k.no_rumah + ' — ' + k.kepala_keluarga
    })));

    const selectedKkMembers = computed(() => wargaList.value.filter(w => w.kk_id === selectedKk.value.id));

    async function loadData() {
      loading.value = true;
      try {
        const res = await SiwargaAPI.call('getWargaData');
        keluargaList.value = res.keluarga || [];
        wargaList.value = res.warga || [];
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loading.value = false;
      }
    }

    function viewKkDetail(kk) {
      selectedKk.value = kk;
      detailDialog.value = true;
    }

    function openKkDialog(row) {
      Object.assign(kkForm, row ? Object.assign({ email: '' }, row) : {
        id: '', no_kk: '', kepala_keluarga: '', blok: 'A', no_rumah: '', alamat: '',
        status_hunian: 'Tetap', no_hp: '', email: '', nominal_ipl: Number(props.settings.nominal_ipl_default || 150000), status_aktif: 'Aktif'
      });
      kkDialog.value = true;
    }

    async function submitKk() {
      saving.value = true;
      try {
        await SiwargaAPI.call('saveKeluarga', Object.assign({}, kkForm));
        $q.notify({ type: 'positive', message: 'Data Kartu Keluarga berhasil disimpan.' });
        kkDialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function confirmDeleteKk(row) {
      $q.dialog({ title: 'Hapus Kartu Keluarga?', message: 'Hapus data rumah ' + row.no_rumah + ' (' + row.kepala_keluarga + ')?', cancel: true }).onOk(async () => {
        try {
          await SiwargaAPI.call('deleteKeluarga', { id: row.id });
          $q.notify({ type: 'positive', message: 'Data KK dihapus.' });
          loadData();
        } catch (err) {
          $q.notify({ type: 'negative', message: err.message });
        }
      });
    }

    function openWargaDialog(row) {
      Object.assign(wargaForm, row ? Object.assign({}, row) : {
        id: '', kk_id: isWarga.value ? props.user.kk_id : (keluargaList.value[0]?.id || ''),
        nik: '', nama_lengkap: '', jenis_kelamin: 'L', tempat_lahir: '', tanggal_lahir: '',
        hubungan_keluarga: 'Anggota', agama: 'Islam', pekerjaan: '', status_perkawinan: 'Belum Kawin',
        no_hp: '', status_warga: 'Aktif'
      });
      wargaDialog.value = true;
    }

    async function submitWarga() {
      saving.value = true;
      try {
        await SiwargaAPI.call('saveWarga', Object.assign({}, wargaForm));
        $q.notify({ type: 'positive', message: 'Data warga berhasil disimpan.' });
        wargaDialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function confirmDeleteWarga(row) {
      $q.dialog({ title: 'Hapus Data Warga?', message: 'Hapus ' + row.nama_lengkap + '?', cancel: true }).onOk(async () => {
        try {
          await SiwargaAPI.call('deleteWarga', { id: row.id });
          $q.notify({ type: 'positive', message: 'Data warga dihapus.' });
          loadData();
        } catch (err) {
          $q.notify({ type: 'negative', message: err.message });
        }
      });
    }

    onMounted(loadData);

    return {
      isAdmin, isWarga, tab, loading, saving, keluargaList, wargaList,
      searchKk, filterHunian, searchWarga, filterStatusWarga,
      kkColumns, wargaColumns, filteredKk, filteredWarga, kkSelectOptions,
      detailDialog, selectedKk, selectedKkMembers, kkDialog, kkForm, wargaDialog, wargaForm,
      viewKkDetail, openKkDialog, submitKk, confirmDeleteKk, openWargaDialog, submitWarga, confirmDeleteWarga,
      formatRupiah: SiwargaAPI.formatRupiah
    };
  }
};
</script>

                  <div style="height: 68px;"></div>

                </div>
                <div class="col-6">
                  <div>{{ formatDateID(previewItem.updated_at || previewItem.created_at) }}</div>
                  <div>Ketua {{ settings.nama_rt }}</div>
                  <div style="height: 68px;"></div>
                  <div><strong><u>{{ settings.ketua_rt }}</u></strong></div>
                </div>
              </div>
            </div>
          </q-card-section>
        </q-card>
      </q-dialog>
    </div>
  `,
  setup(props) {
    const { ref, reactive, computed, onMounted } = Vue;
    const $q = Quasar.useQuasar();
    const isAdmin = computed(() => SiwargaAPI.isAdminRole(props.user, props.settings));
    const loading = ref(false);
    const saving = ref(false);
    const suratList = ref([]);
    const wargaList = ref([]);
    const search = ref('');
    const filterStatus = ref('Semua');

    const createDialog = ref(false);
    const form = reactive({ warga_id: '', jenis_surat: 'Surat Pengantar KTP / KK', keperluan: '', keterangan: '' });
    const processDialog = ref(false);
    const procForm = reactive({ id: '', jenis_surat: '', nama_pemohon: '', no_rumah: '', keperluan: '', status: 'Disetujui', catatan_admin: '', generate_pdf: true });
    const previewDialog = ref(false);
    const previewItem = ref({});

    const jenisSuratOptions = [
      'Surat Pengantar KTP / KK',
      'Surat Keterangan Domisili',
      'Surat Keterangan Usaha (SKU)',
      'Surat Keterangan Tidak Mampu (SKTM)',
      'Surat Pengantar Nikah (N1-N4)',
      'Surat Pengantar SKCK',
      'Surat Izin Keramaian / Hajatan',
      'Surat Keterangan Pindah Datang / Keluar'
    ];

    const columns = [
      { name: 'nomor_surat', label: 'No. Surat', field: 'nomor_surat', align: 'left' },
      { name: 'nama_pemohon', label: 'Pemohon', field: 'nama_pemohon', align: 'left', sortable: true },
      { name: 'no_rumah', label: 'Rumah', field: 'no_rumah', align: 'center' },
      { name: 'jenis_surat', label: 'Jenis Surat', field: 'jenis_surat', align: 'left' },
      { name: 'keperluan', label: 'Keperluan', field: 'keperluan', align: 'left' },
      { name: 'status', label: 'Status', field: 'status', align: 'center' },
      { name: 'actions', label: 'Aksi', field: 'id', align: 'right' }
    ];

    const wargaOptions = computed(() => wargaList.value.map(w => ({
      value: w.id, label: w.nama_lengkap + ' (' + w.no_rumah + ')'
    })));

    const filteredSurat = computed(() => {
      const q = (search.value || '').toLowerCase();
      return suratList.value.filter(s => {
        if (filterStatus.value !== 'Semua' && s.status !== filterStatus.value) return false;
        if (!q) return true;
        return [s.nomor_surat, s.nama_pemohon, s.jenis_surat, s.keperluan, s.no_rumah].some(v => String(v || '').toLowerCase().includes(q));
      });
    });

    function statusColor(st) {
      if (st === 'Disetujui') return 'positive';
      if (st === 'Ditolak') return 'negative';
      if (st === 'Diproses') return 'info';
      return 'amber-9';
    }

    async function loadData() {
      loading.value = true;
      try {
        const [suratRes, wargaRes] = await Promise.all([
          SiwargaAPI.call('getSuratList'),
          SiwargaAPI.call('getWargaData')
        ]);
        suratList.value = suratRes || [];
        wargaList.value = (wargaRes && wargaRes.warga) || [];
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loading.value = false;
      }
    }

    function openCreateDialog() {
      Object.assign(form, {
        warga_id: wargaList.value[0]?.id || '',
        jenis_surat: 'Surat Pengantar KTP / KK',
        keperluan: '', keterangan: ''
      });
      createDialog.value = true;
    }

    async function submitCreate() {
      saving.value = true;
      try {
        await SiwargaAPI.call('createSurat', Object.assign({}, form));
        $q.notify({ type: 'positive', message: 'Pengajuan surat berhasil dikirim ke pengurus RT.' });
        createDialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function openProcessDialog(row) {
      Object.assign(procForm, {
        id: row.id, jenis_surat: row.jenis_surat, nama_pemohon: row.nama_pemohon,
        no_rumah: row.no_rumah, keperluan: row.keperluan,
        status: row.status === 'Diajukan' ? 'Disetujui' : row.status,
        catatan_admin: row.catatan_admin || '', generate_pdf: true
      });
      processDialog.value = true;
    }

    async function submitProcess() {
      saving.value = true;
      try {
        await SiwargaAPI.call('processSurat', Object.assign({}, procForm));
        $q.notify({ type: 'positive', message: 'Status surat berhasil diperbarui.' });
        processDialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function openPreview(row) {
      previewItem.value = row;
      previewDialog.value = true;
    }

    function printSurat() {
      window.print();
    }

    function deleteSurat(row) {
      $q.dialog({ title: 'Hapus Pengajuan Surat?', message: 'Hapus surat ' + row.jenis_surat + ' milik ' + row.nama_pemohon + '?', cancel: true }).onOk(async () => {
        try {
          await SiwargaAPI.call('deleteSurat', { id: row.id });
          $q.notify({ type: 'positive', message: 'Data surat dihapus.' });
          loadData();
        } catch (err) {
          $q.notify({ type: 'negative', message: err.message });
        }
      });
    }

    onMounted(loadData);

    return {
      isAdmin, loading, saving, search, filterStatus, columns, filteredSurat,
      jenisSuratOptions, wargaOptions, createDialog, form, processDialog, procForm,
      previewDialog, previewItem, statusColor, openCreateDialog, submitCreate,
      openProcessDialog, submitProcess, openPreview, printSurat, deleteSurat,
      formatDateID: SiwargaAPI.formatDateID
    };
  }
};
</script>

              </div>
            </q-form>
          </q-card-section>
        </q-card>
      </q-dialog>
    </div>
  `,
  setup(props) {
    const { ref, reactive, computed, onMounted } = Vue;
    const $q = Quasar.useQuasar();
    const isAdmin = computed(() => SiwargaAPI.isAdminRole(props.user));
    const canManage = computed(() => SiwargaAPI.isFinanceStaff(props.user));
    const loading = ref(false);
    const saving = ref(false);
    const list = ref([]);
    const search = ref('');
    const filterKategori = ref('Semua');
    const dialog = ref(false);
    const uploadFile = ref(null);
    const form = reactive({ id: '', judul: '', kategori: 'Umum', prioritas: 'Normal', isi: '', pinned: false, lampiran_url: '', lampiran_id: '', lampiran_nama: '' });

    const filteredList = computed(() => {
      const q = (search.value || '').toLowerCase();
      return list.value.filter(i => {
        if (filterKategori.value !== 'Semua' && i.kategori !== filterKategori.value) return false;
        if (!q) return true;
        return (i.judul + ' ' + i.isi).toLowerCase().includes(q);
      });
    });

    function priorityColor(p) {
      if (p === 'Mendesak') return 'red-7';
      if (p === 'Penting') return 'amber-9';
      return 'blue-grey-6';
    }

    async function loadData() {
      loading.value = true;
      try {
        list.value = await SiwargaAPI.call('getPengumumanList') || [];
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loading.value = false;
      }
    }

    function openForm(item) {
      uploadFile.value = null;
      Object.assign(form, item ? Object.assign({}, item, { pinned: item.pinned === true || item.pinned === 'true' }) : {
        id: '', judul: '', kategori: 'Umum', prioritas: 'Normal', isi: '', pinned: false, lampiran_url: '', lampiran_id: '', lampiran_nama: ''
      });
      dialog.value = true;
    }

    async function submitForm() {
      saving.value = true;
      try {
        const payload = Object.assign({}, form);
        if (uploadFile.value) {
          payload.filePayload = await SiwargaAPI.readFileAsPayload(uploadFile.value);
        }
        await SiwargaAPI.call('savePengumuman', payload);
        $q.notify({ type: 'positive', message: 'Pengumuman berhasil disimpan.' });
        dialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function deleteItem(item) {
      $q.dialog({ title: 'Hapus Pengumuman?', message: item.judul, cancel: true }).onOk(async () => {
        try {
          await SiwargaAPI.call('deletePengumuman', { id: item.id });
          $q.notify({ type: 'positive', message: 'Pengumuman dihapus.' });
          loadData();
        } catch (err) {
          $q.notify({ type: 'negative', message: err.message });
        }
      });
    }

    onMounted(loadData);

    return {
      isAdmin, canManage, loading, saving, search, filterKategori, filteredList,
      dialog, form, uploadFile, priorityColor, openForm, submitForm, deleteItem,
      formatDateID: SiwargaAPI.formatDateID
    };
  }
};

              <q-input v-model="kegForm.penanggung_jawab" outlined dense label="Penanggung Jawab" />

              <div class="row justify-end q-gutter-sm q-mt-md">

                <q-btn type="submit" unelevated color="teal-8" label="Simpan Kegiatan" :loading="saving" />

          </q-card-section>

      </q-dialog>

      <!-- Dialog Kirim Pengaduan -->
      <q-dialog v-model="aduDialog" persistent>

          <q-card-section class="bg-deep-orange-7 text-white row items-center justify-between">
            <div class="text-subtitle1 text-weight-bold">Kirim Pengaduan / Aspirasi Warga</div>
            <q-btn flat round dense icon="close" v-close-popup />

          <q-card-section>

                <div class="col-6"><q-select v-model="aduForm.kategori" :options="['Fasilitas', 'Keamanan', 'Kebersihan', 'Tetangga', 'Lainnya']" outlined dense label="Kategori" /></div>
                <div class="col-6"><q-select v-model="aduForm.prioritas" :options="['Rendah', 'Sedang', 'Tinggi']" outlined dense label="Tingkat Prioritas" /></div>
              </div>
              <q-input v-model="aduForm.judul" outlined dense label="Judul Laporan *" :rules="[v=>!!v||'Wajib']" placeholder="Contoh: Saluran air Blok B mampet" />
              <q-input v-model="aduForm.deskripsi" type="textarea" rows="4" outlined dense label="Uraian Kejadian / Lokasi *" :rules="[v=>!!v||'Wajib']" />
              <q-file v-model="aduFile" outlined dense clearable accept=".jpg,.jpeg,.png,.webp" label="Foto Kondisi Lapangan (Opsional, maks 5MB)">
                <template #prepend><q-icon name="photo_camera" /></template>
              </q-file>

      <!-- Dialog Tanggapan Pengurus -->
      <q-dialog v-model="respDialog" persistent>
        <q-card style="width: 480px; max-width: 95vw;">

            <div class="text-subtitle1 text-weight-bold">Tindak Lanjut Pengaduan</div>
            <q-btn flat round dense icon="close" v-close-popup />

          <q-card-section>
            <div class="text-weight-bold q-mb-sm">{{ respForm.judul }}</div>
            <q-form @submit.prevent="submitRespond" class="q-gutter-sm">
              <q-select v-model="respForm.status" :options="['Baru', 'Diproses', 'Selesai', 'Ditolak']" outlined dense label="Status Penanganan" />
              <q-input v-model="respForm.tanggapan_rt" type="textarea" rows="4" outlined dense label="Tanggapan Resmi Pengurus RT *" :rules="[v=>!!v||'Wajib diisi']" />

              </div>
            </q-form>
          </q-card-section>

      </q-dialog>

  `,
  setup(props) {
    const { ref, reactive, computed, onMounted } = Vue;
    const $q = Quasar.useQuasar();
    const isAdmin = computed(() => SiwargaAPI.isAdminRole(props.user));
    const canRespond = computed(() => SiwargaAPI.isFinanceStaff(props.user));
    const tab = ref('kegiatan');
    const saving = ref(false);
    const kegiatanList = ref([]);
    const pengaduanList = ref([]);

    const kegDialog = ref(false);
    const kegForm = reactive({});
    const aduDialog = ref(false);
    const aduFile = ref(null);
    const aduForm = reactive({ kategori: 'Fasilitas', prioritas: 'Sedang', judul: '', deskripsi: '' });
    const respDialog = ref(false);
    const respForm = reactive({ id: '', judul: '', status: 'Diproses', tanggapan_rt: '' });

    function aduanStatusColor(st) {
      if (st === 'Selesai') return 'positive';
      if (st === 'Diproses') return 'info';
      if (st === 'Ditolak') return 'negative';
      return 'deep-orange-7';
    }

    function hasJoined(k) {
      const key = props.user.kk_id || props.user.id;
      return (k.peserta || []).some(p => String(p.kk_id) === String(key));
    }

    async function loadData() {
      try {
        const [keg, adu] = await Promise.all([
          SiwargaAPI.call('getKegiatanList'),
          SiwargaAPI.call('getPengaduanList')
        ]);
        kegiatanList.value = keg || [];
        pengaduanList.value = adu || [];
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      }
    }

    function openKegDialog(row) {
      Object.assign(kegForm, row ? Object.assign({}, row) : {
        id: '', judul: '', kategori: 'Kerja Bakti', tanggal: new Date().toISOString().substring(0, 10),
        waktu_mulai: '07:30', waktu_selesai: '10:30', lokasi: '', deskripsi: '', penanggung_jawab: 'Pengurus RT', kuota: 40, status: 'Akan Datang'
      });
      kegDialog.value = true;
    }

    async function submitKeg() {
      saving.value = true;
      try {
        await SiwargaAPI.call('saveKegiatan', Object.assign({}, kegForm));
        $q.notify({ type: 'positive', message: 'Agenda kegiatan disimpan.' });
        kegDialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    async function toggleRsvp(k) {
      try {
        const res = await SiwargaAPI.call('toggleRsvpKegiatan', { id: k.id });
        k.peserta = res.peserta;
        $q.notify({ type: 'positive', message: res.joined ? 'Kehadiran Anda tercatat!' : 'Konfirmasi kehadiran dibatalkan.' });
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      }
    }

    function deleteKeg(k) {
      $q.dialog({ title: 'Hapus Kegiatan?', message: k.judul, cancel: true }).onOk(async () => {
        try {
          await SiwargaAPI.call('deleteKegiatan', { id: k.id });
          loadData();
        } catch (err) { $q.notify({ type: 'negative', message: err.message }); }
      });
    }

    function openAduDialog() {
      aduFile.value = null;
      Object.assign(aduForm, { kategori: 'Fasilitas', prioritas: 'Sedang', judul: '', deskripsi: '' });
      aduDialog.value = true;
    }

    async function submitAdu() {
      saving.value = true;
      try {
        const payload = Object.assign({}, aduForm);
        if (aduFile.value) {
          payload.filePayload = await SiwargaAPI.readFileAsPayload(aduFile.value);
        }
        await SiwargaAPI.call('createPengaduan', payload);
        $q.notify({ type: 'positive', message: 'Pengaduan berhasil dikirim ke pengurus RT.' });
        aduDialog.value = false;
        tab.value = 'pengaduan';
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function openRespondDialog(p) {
      Object.assign(respForm, { id: p.id, judul: p.judul, status: p.status === 'Baru' ? 'Diproses' : p.status, tanggapan_rt: p.tanggapan_rt || '' });
      respDialog.value = true;
    }

    async function submitRespond() {
      saving.value = true;
      try {
        await SiwargaAPI.call('respondPengaduan', Object.assign({}, respForm));
        $q.notify({ type: 'positive', message: 'Tanggapan pengaduan berhasil disimpan.' });
        respDialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function deleteAdu(p) {
      $q.dialog({ title: 'Hapus Pengaduan?', message: p.judul, cancel: true }).onOk(async () => {
        try {
          await SiwargaAPI.call('deletePengaduan', { id: p.id });
          loadData();
        } catch (err) { $q.notify({ type: 'negative', message: err.message }); }
      });
    }

    onMounted(loadData);

    return {
      isAdmin, canRespond, tab, saving, kegiatanList, pengaduanList,
      kegDialog, kegForm, aduDialog, aduFile, aduForm, respDialog, respForm,
      aduanStatusColor, hasJoined, openKegDialog, submitKeg, toggleRsvp, deleteKeg,
      openAduDialog, submitAdu, openRespondDialog, submitRespond, deleteAdu,
      formatDateID: SiwargaAPI.formatDateID
    };
  }
};
</script>

    const kkSearchFilter = ref('');
    const allHouseBills = ref([]);
    const rapelFile = ref(null);
    const rapelPreviewDataUrl = ref('');
    const rapelPeriodeFilter = ref('');
    const rapelForm = reactive({
      mode: 'range',
      kk_id: '',
      periode_mulai: currentYm,
      periode_selesai: currentYear + '-12',
      custom_periods: [],
      nominal_per_bulan: 150000,
      metode_bayar: 'Transfer Bank',
      rekening_tujuan: '',
      catatan_warga: '',
      langsung_lunas: true
    });
    const proofDialog = ref(false);
    const proofItem = ref({});
    const sendingSingleId = ref('');
    const waBulkDialog = ref(false);
    const selectedWaIds = ref([]);
    const waBulkTemplate = ref('');
    const sendingBulkWa = ref(false);
    const waBulkResult = ref(null);
    const waLogDialog = ref(false);
    const loadingLogs = ref(false);
    const waLogs = ref([]);

    const waLogColumns = [
      { name: 'tanggal', label: 'Waktu', field: 'tanggal', align: 'left', format: val => SiwargaAPI.formatDateTimeID(val) },
      { name: 'no_rumah', label: 'Rumah', field: 'no_rumah', align: 'center' },
      { name: 'nama_warga', label: 'Warga', field: 'nama_warga', align: 'left' },
      { name: 'no_hp', label: 'No. WA', field: 'no_hp', align: 'left' },
      { name: 'provider', label: 'Provider', field: 'provider', align: 'center' },
      { name: 'status', label: 'Status', field: 'status', align: 'center' },
      { name: 'response_msg', label: 'Keterangan', field: 'response_msg', align: 'left' }
    ];

    const periodeFilterOptions = SiwargaAPI.buildPeriodeOptions(true);
    const periodeGenerateOptions = SiwargaAPI.buildPeriodeOptions(false);
    const periodeRapelOptions = SiwargaAPI.buildPeriodeOptions(false, 36, 12);

    const columns = [
      { name: 'periode', label: 'Periode', field: 'periode', align: 'left', sortable: true, format: val => SiwargaAPI.formatPeriodeID(val) },
      { name: 'no_rumah', label: 'Rumah', field: 'no_rumah', align: 'left', sortable: true },
      { name: 'kepala_keluarga', label: 'Kepala Keluarga', field: 'kepala_keluarga', align: 'left', sortable: true },
      { name: 'total', label: 'Nominal IPL', field: 'total', align: 'right', sortable: true },
      { name: 'tanggal_jatuh_tempo', label: 'Jatuh Tempo', field: 'tanggal_jatuh_tempo', align: 'center', format: val => SiwargaAPI.formatDateID(val) },
      { name: 'status', label: 'Status', field: 'status', align: 'center', sortable: true },
      { name: 'actions', label: 'Aksi', field: 'id', align: 'right' }
    ];

    const filteredRows = computed(() => {
      const q = (search.value || '').toLowerCase();
      return rows.value.filter(r => {
        if (filterStatus.value !== 'Semua' && r.status !== filterStatus.value) return false;
        if (!q) return true;
        return [r.no_rumah, r.kepala_keluarga, r.periode, SiwargaAPI.formatPeriodeID(r.periode)].some(v => String(v || '').toLowerCase().includes(q));
      });
    });

    const activeBankAccounts = computed(() =>
      SiwargaAPI.parseBankAccounts(props.settings).filter(a => a.aktif !== false && (a.bank || a.norek))
    );

    const bankSelectOptions = computed(() =>
      activeBankAccounts.value.map(a => {
        const val = a.bank + ' · ' + a.norek + (a.atas_nama ? (' (a.n. ' + a.atas_nama + ')') : '');
        return {
          value: val,
          label: a.bank + ' — ' + a.norek,
          raw: a
        };
      })
    );

    const selectedUploadBank = computed(() => {
      const found = bankSelectOptions.value.find(o => o.value === uploadForm.rekening_tujuan);
      return found ? found.raw : null;
    });

    const selectedRapelBank = computed(() => {
      const found = bankSelectOptions.value.find(o => o.value === rapelForm.rekening_tujuan);
      return found ? found.raw : null;
    });

    const kkOptions = computed(() =>
      kkList.value
        .filter(k => k.status_aktif !== 'Nonaktif')
        .map(k => ({
          value: k.id,
          label: k.no_rumah + ' — ' + k.kepala_keluarga,
          raw: k
        }))
    );

    const filteredKkOptions = computed(() => {
      const q = (kkSearchFilter.value || '').toLowerCase();
      if (!q) return kkOptions.value;
      return kkOptions.value.filter(o => o.label.toLowerCase().includes(q));
    });

    const filteredRapelPeriodeOptions = computed(() => {
      const q = (rapelPeriodeFilter.value || '').toLowerCase();
      if (!q) return periodeRapelOptions;
      return periodeRapelOptions.filter(o => o.label.toLowerCase().includes(q) || o.value.toLowerCase().includes(q));
    });

    const rapelPreview = computed(() => {
      let range = [];
      if (rapelForm.mode === 'custom') {
        const seen = {};
        (rapelForm.custom_periods || []).forEach(ym => {
          const s = String(ym || '').trim();
          if (/^\d{4}-\d{2}$/.test(s) && !seen[s]) { seen[s] = true; range.push(s); }
        });
        range.sort();
        if (!range.length) {
          return { invalid: true, months: [], payable: [], skippedLunas: [], grandTotal: 0 };
        }
      } else {
        const s = rapelForm.periode_mulai;
        const e = rapelForm.periode_selesai;
        if (!s || !e || s > e) {
          return { invalid: true, months: [], payable: [], skippedLunas: [], grandTotal: 0 };
        }
        range = SiwargaAPI.expandPeriodeRange(s, e);
      }
      const targetKkId = canManage.value ? String(rapelForm.kk_id || '') : String(props.user.kk_id || '');
      const existingMap = {};
      allHouseBills.value.forEach(b => {
        if (!targetKkId || String(b.kk_id) === targetKkId) {
          existingMap[String(b.periode)] = b;
        }
      });
      const months = [];
      const payable = [];
      const skippedLunas = [];
      let grandTotal = 0;
      const baseNom = Number(rapelForm.nominal_per_bulan || props.settings.nominal_ipl_default || 150000);
      range.forEach(ym => {
        const ex = existingMap[ym];
        const isLunas = !!(ex && ex.status === 'Lunas');
        const nom = ex ? Number(ex.total || ex.nominal || baseNom) : baseNom;
        months.push({ ym, isLunas, nom });
        if (isLunas) {
          skippedLunas.push(ym);
        } else {
          payable.push(ym);
          grandTotal += nom;
        }
      });
      return { invalid: false, months, payable, skippedLunas, grandTotal };
    });

    const unpaidRows = computed(() =>
      filteredRows.value.filter(r => r.status === 'Belum Bayar' || r.status === 'Ditolak')
    );

    const summary = computed(() => {
      let totalDitagih = 0, totalLunas = 0, totalPending = 0, totalUnpaid = 0;
      let countLunas = 0, countPending = 0, countUnpaid = 0;
      filteredRows.value.forEach(r => {
        const nom = Number(r.total || r.nominal || 0);
        totalDitagih += nom;
        if (r.status === 'Lunas') { totalLunas += nom; countLunas++; }
        else if (r.status === 'Menunggu Verifikasi') { totalPending += nom; countPending++; }
        else { totalUnpaid += nom; countUnpaid++; }
      });
      return { totalDitagih, totalLunas, totalPending, totalUnpaid, countLunas, countPending, countUnpaid };
    });

    function statusColor(st) {
      if (st === 'Lunas') return 'positive';
      if (st === 'Menunggu Verifikasi') return 'amber-9';
      if (st === 'Ditolak') return 'negative';
      return 'blue-grey-6';
    }

    async function loadData() {
      loading.value = true;
      try {
        rows.value = await SiwargaAPI.call('getTagihanIpl', { periode: filterPeriode.value || 'ALL' }) || [];
        if (props.autoOpenBillId) {
          const targetBill = rows.value.find(b => String(b.id) === String(props.autoOpenBillId));
          if (targetBill && (targetBill.status === 'Belum Bayar' || targetBill.status === 'Ditolak')) {
            openUploadDialog(targetBill);
          }
          emit('clear-auto-open');
        }
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loading.value = false;
      }
    }

    function openGenerateDialog() {
      genForm.periode = filterPeriode.value || SiwargaAPI.currentPeriode();
      genForm.nominal_default = Number(props.settings.nominal_ipl_default || 150000);
      genDialog.value = true;
    }

    async function submitGenerate() {
      saving.value = true;
      try {
        const res = await SiwargaAPI.call('generateTagihanBulanan', Object.assign({}, genForm));
        $q.notify({ type: 'positive', message: res.message });
        filterPeriode.value = genForm.periode;
        genDialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function openUploadDialog(bill) {
      selectedBill.value = bill;
      uploadFile.value = null;
      uploadPreviewDataUrl.value = '';
      uploadForm.metode_bayar = bill.metode_bayar || 'Transfer Bank';
      uploadForm.rekening_tujuan = bill.rekening_tujuan || (bankSelectOptions.value[0] ? bankSelectOptions.value[0].value : '');
      uploadForm.catatan_warga = bill.catatan_warga || '';
      uploadDialog.value = true;
    }

    function onPickFile(file) {
      uploadPreviewDataUrl.value = '';
      if (file && file.type && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = () => { uploadPreviewDataUrl.value = reader.result; };
        reader.readAsDataURL(file);
      }
    }

    function filterKkSelect(val, update) {
      update(() => { kkSearchFilter.value = val || ''; });
    }

    function filterRapelPeriodeSelect(val, update) {
      update(() => { rapelPeriodeFilter.value = val || ''; });
    }

    function addAllUnpaidToCustom() {
      const targetKkId = canManage.value ? String(rapelForm.kk_id || '') : String(props.user.kk_id || '');
      if (!targetKkId) {
        $q.notify({ type: 'warning', message: 'Pilih rumah warga terlebih dahulu.' });
        return;
      }
      const unpaid = allHouseBills.value
        .filter(b => String(b.kk_id) === targetKkId && (b.status === 'Belum Bayar' || b.status === 'Ditolak') && b.periode)
        .map(b => String(b.periode));
      const merged = Array.from(new Set((rapelForm.custom_periods || []).concat(unpaid))).sort();
      rapelForm.custom_periods = merged;
      if (!unpaid.length) {
        $q.notify({ type: 'info', message: 'Tidak ada tunggakan tercatat di sistem untuk rumah ini. Anda tetap bisa memilih bulan secara manual.' });
      }
    }

    function onSelectRapelKk(kkId) {
      const found = kkList.value.find(k => String(k.id) === String(kkId));
      if (found) {
        rapelForm.nominal_per_bulan = Number(found.nominal_ipl || props.settings.nominal_ipl_default || 150000);
      }
    }

    function setRapelEndCurrent() {
      rapelForm.periode_selesai = currentYm;
      if (rapelForm.periode_mulai > currentYm) {
        rapelForm.periode_mulai = currentYm;
      }
    }

    function setRapelEndYear() {
      rapelForm.periode_selesai = currentYear + '-12';
    }

    function onPickRapelFile(file) {
      rapelPreviewDataUrl.value = '';
      if (file && file.type && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = () => { rapelPreviewDataUrl.value = reader.result; };
        reader.readAsDataURL(file);
      }
    }

    async function openRapelDialog() {
      rapelFile.value = null;
      rapelPreviewDataUrl.value = '';
      rapelForm.mode = 'range';
      rapelForm.custom_periods = [];
      rapelForm.metode_bayar = 'Transfer Bank';
      rapelForm.rekening_tujuan = bankSelectOptions.value[0] ? bankSelectOptions.value[0].value : '';
      rapelForm.catatan_warga = '';
      rapelForm.langsung_lunas = canManage.value;
      rapelForm.periode_mulai = currentYm;
      rapelForm.periode_selesai = currentYear + '-12';
      rapelForm.nominal_per_bulan = Number(props.settings.nominal_ipl_default || 150000);
      rapelForm.kk_id = canManage.value ? '' : (props.user.kk_id || '');
      rapelDialog.value = true;

      // Muat seluruh tagihan rumah agar preview otomatis mendeteksi bulan yang sudah Lunas
      loadingKk.value = true;
      try {
        const reqs = [SiwargaAPI.call('getTagihanIpl', { periode: 'ALL' })];
        if (canManage.value && !kkList.value.length) {
          reqs.push(SiwargaAPI.call('getWargaData'));
        }
        const results = await Promise.all(reqs);
        allHouseBills.value = results[0] || [];
        if (canManage.value && results[1] && results[1].keluarga) {
          kkList.value = results[1].keluarga;
        }
        // Untuk warga: jika punya tunggakan bulan terlama, otomatis jadikan "Dari Bulan"
        if (!canManage.value) {
          const unpaidMine = allHouseBills.value
            .filter(b => b.status !== 'Lunas' && b.periode)
            .sort((a, b) => String(a.periode).localeCompare(String(b.periode)));
          if (unpaidMine.length) {
            rapelForm.periode_mulai = unpaidMine[0].periode;
            rapelForm.nominal_per_bulan = Number(unpaidMine[0].nominal || props.settings.nominal_ipl_default || 150000);
          }
        }
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loadingKk.value = false;
      }
    }

    async function submitRapel() {
      if (canManage.value && !rapelForm.kk_id) {
        $q.notify({ type: 'warning', message: 'Pilih rumah warga terlebih dahulu.' });
        return;
      }
      if (rapelPreview.value.invalid || !rapelPreview.value.payable.length) {
        $q.notify({ type: 'warning', message: 'Tidak ada bulan yang perlu dibayar pada rentang periode tersebut.' });
        return;
      }
      saving.value = true;
      try {
        let filePayload = null;
        if (rapelFile.value) {
          filePayload = await SiwargaAPI.readFileAsPayload(rapelFile.value);
        } else if (rapelForm.metode_bayar !== 'Tunai' && !(canManage.value && rapelForm.langsung_lunas)) {
          throw new Error('Silakan lampirkan foto/PDF bukti transfer pembayaran rapel.');
        }
        if (rapelForm.metode_bayar === 'Transfer Bank' && bankSelectOptions.value.length && !rapelForm.rekening_tujuan) {
          throw new Error('Silakan pilih bank / rekening tujuan transfer terlebih dahulu.');
        }
        const res = await SiwargaAPI.call('submitRapelIpl', {
          kk_id: rapelForm.kk_id,
          periode_mulai: rapelForm.mode === 'range' ? rapelForm.periode_mulai : '',
          periode_selesai: rapelForm.mode === 'range' ? rapelForm.periode_selesai : '',
          periods: rapelForm.mode === 'custom' ? rapelPreview.value.payable.slice() : [],
          nominal_per_bulan: rapelForm.nominal_per_bulan,
          metode_bayar: rapelForm.metode_bayar,
          rekening_tujuan: rapelForm.rekening_tujuan,
          catatan_warga: rapelForm.catatan_warga,
          langsung_lunas: canManage.value ? rapelForm.langsung_lunas : false,
          filePayload: filePayload
        });
        $q.notify({ type: 'positive', message: res.message || 'Pembayaran rapel berhasil diproses!' });
        rapelDialog.value = false;
        emit('refresh-badges');
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    async function submitUpload() {
      saving.value = true;
      try {
        let filePayload = null;
        if (uploadFile.value) {
          filePayload = await SiwargaAPI.readFileAsPayload(uploadFile.value);
        } else if (uploadForm.metode_bayar !== 'Tunai') {
          throw new Error('Silakan unggah foto/PDF bukti pembayaran terlebih dahulu.');
        }
        if (uploadForm.metode_bayar === 'Transfer Bank' && bankSelectOptions.value.length && !uploadForm.rekening_tujuan) {
          throw new Error('Silakan pilih bank / rekening tujuan transfer terlebih dahulu.');
        }
        await SiwargaAPI.call('uploadBuktiIpl', {
          tagihan_id: selectedBill.value.id,
          metode_bayar: uploadForm.metode_bayar,
          rekening_tujuan: uploadForm.metode_bayar === 'Transfer Bank' ? uploadForm.rekening_tujuan : '',
          catatan_warga: uploadForm.catatan_warga,
          filePayload: filePayload
        });
        $q.notify({ type: 'positive', message: 'Bukti pembayaran berhasil dikirim! Menunggu verifikasi Bendahara.' });
        uploadDialog.value = false;
        emit('refresh-badges');
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function openProofPreview(bill) {
      proofItem.value = bill;
      proofDialog.value = true;
    }

    function copyRekening(norek, bankName) {
      const txt = norek || (activeBankAccounts.value[0] && activeBankAccounts.value[0].norek) || props.settings.bank_norek || '';
      if (navigator.clipboard && txt) {
        navigator.clipboard.writeText(txt);
        $q.notify({ type: 'positive', message: 'Nomor rekening ' + (bankName ? bankName + ' ' : '') + 'disalin: ' + txt });
      }
    }

    function renderWaPreviewText(bill) {
      const tpl = props.settings.wa_template_ipl ||
        'Halo Bapak/Ibu {nama} (Rumah {no_rumah}), mengingatkan tagihan IPL {nama_lingkungan} periode {periode} sebesar {nominal} (jatuh tempo {jatuh_tempo}). Transfer ke:\n{bank_info}';
      const bankInfo = SiwargaAPI.formatBankInfo(props.settings);
      return tpl
        .replace(/\{nama\}/g, bill.kepala_keluarga || 'Warga')
        .replace(/\{no_rumah\}/g, bill.no_rumah || '-')
        .replace(/\{periode\}/g, SiwargaAPI.formatPeriodeID(bill.periode))
        .replace(/\{nominal\}/g, SiwargaAPI.formatRupiah(bill.total || bill.nominal))
        .replace(/\{jatuh_tempo\}/g, SiwargaAPI.formatDateID(bill.tanggal_jatuh_tempo))
        .replace(/\{nama_rt\}/g, props.settings.nama_rt || 'RT')
        .replace(/\{nama_lingkungan\}/g, props.settings.nama_lingkungan || 'Perumahan Griya Kedaung Asri')
        .replace(/\{bank_info\}/g, bankInfo);
    }

    function buildWaMeLink(bill) {
      let p = String(bill.no_hp || '').replace(/[^0-9]/g, '');
      if (p.startsWith('0')) p = '62' + p.slice(1);
      const txt = encodeURIComponent(renderWaPreviewText(bill));
      return 'https://wa.me/' + p + '?text=' + txt;
    }

    async function sendSingleWa(bill) {
      if (!bill.no_hp) {
        $q.notify({ type: 'warning', message: 'Nomor HP/WA untuk rumah ' + bill.no_rumah + ' belum diisi di Data Keluarga.' });
        return;
      }
      sendingSingleId.value = bill.id;
      try {
        const res = await SiwargaAPI.call('sendIplReminderSingle', { tagihan_id: bill.id });
        $q.notify({ type: 'positive', message: 'Pengingat WA terkirim ke Rumah ' + res.no_rumah + ' (' + res.target + ')' });
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        sendingSingleId.value = '';
      }
    }

    function openWaBulkDialog() {
      waBulkResult.value = null;
      waBulkTemplate.value = props.settings.wa_template_ipl || '';
      selectedWaIds.value = unpaidRows.value.filter(r => !!r.no_hp).map(r => r.id);
      waBulkDialog.value = true;
    }

    function selectAllWa(checked) {
      selectedWaIds.value = checked ? unpaidRows.value.filter(r => !!r.no_hp).map(r => r.id) : [];
    }

    async function submitWaBulk() {
      sendingBulkWa.value = true;
      waBulkResult.value = null;
      try {
        const res = await SiwargaAPI.call('sendIplReminderBulk', {
          periode: filterPeriode.value || SiwargaAPI.currentPeriode(),
          tagihan_ids: selectedWaIds.value.slice(),
          custom_template: waBulkTemplate.value
        });
        waBulkResult.value = res;
        $q.notify({ type: res.failed > 0 ? 'warning' : 'positive', message: res.message });
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        sendingBulkWa.value = false;
      }
    }

    async function openWaLogDialog() {
      waLogDialog.value = true;
      loadingLogs.value = true;
      try {
        waLogs.value = await SiwargaAPI.call('getWaLogList') || [];
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loadingLogs.value = false;
      }
    }

    onMounted(loadData);

    return {
      canManage, loading, saving, filterPeriode, filterStatus, search, mobileLimit,
      columns, periodeFilterOptions, periodeGenerateOptions, periodeRapelOptions, filteredRapelPeriodeOptions, filteredRows, unpaidRows, activeBankAccounts, bankSelectOptions, selectedUploadBank, selectedRapelBank, summary, genDialog, genForm,
      uploadDialog, selectedBill, uploadFile, uploadPreviewDataUrl, uploadForm,
      currentYm, currentYear, rapelDialog, loadingKk, filteredKkOptions, rapelFile, rapelPreviewDataUrl, rapelForm, rapelPreview,
      proofDialog, proofItem, sendingSingleId, waBulkDialog, selectedWaIds, waBulkTemplate,
      sendingBulkWa, waBulkResult, waLogDialog, loadingLogs, waLogs, waLogColumns,
      statusColor, loadData, openGenerateDialog, submitGenerate,
      openUploadDialog, onPickFile, submitUpload, openRapelDialog, filterKkSelect, filterRapelPeriodeSelect, addAllUnpaidToCustom, onSelectRapelKk, setRapelEndCurrent, setRapelEndYear, onPickRapelFile, submitRapel,
      openProofPreview, copyRekening,
      buildWaMeLink, sendSingleWa, openWaBulkDialog, selectAllWa, submitWaBulk, openWaLogDialog,
      formatRupiah: SiwargaAPI.formatRupiah, formatDateID: SiwargaAPI.formatDateID, formatPeriodeID: SiwargaAPI.formatPeriodeID, formatPeriodsSummary: SiwargaAPI.formatPeriodsSummary
    };
  }
};
</script>

  <script>
window.CompFinanceVerif = {
  props: ['user', 'settings'],
  emits: ['refresh-badges'],
  template: `
    <div>
      <div class="row items-center justify-between q-mb-md q-gutter-sm">
        <div>
          <div class="text-h6 text-weight-bold text-grey-9">Verifikasi Pembayaran Bendahara</div>
          <div class="text-caption text-grey-6">Periksa bukti pembayaran IPL warga. Persetujuan otomatis mencatat transaksi Kas Masuk ke Buku Kas.</div>
        </div>
        <q-btn outline color="teal-8" icon="refresh" label="Muat Ulang" @click="loadData" :loading="loading" />
      </div>

      <q-card flat class="surface-card q-mb-md">
        <q-tabs v-model="tab" dense align="left" active-color="teal-8" indicator-color="teal-8" class="text-grey-7 q-px-md q-pt-sm">
          <q-tab name="pending" icon="hourglass_top" :label="'Menunggu Verifikasi (' + pendingCards.length + ')'" />
          <q-tab name="history" icon="history" :label="'Riwayat Verifikasi (' + historyList.length + ')'" />
        </q-tabs>
        <q-separator />

        <q-tab-panels v-model="tab" animated>
          <q-tab-panel name="pending" class="q-pa-md">
            <div v-if="pendingCards.length" class="row q-col-gutter-sm q-mb-md">
              <div class="col-12 col-sm-6">
                <q-input
                  v-model="searchPending"
                  outlined dense clearable
                  placeholder="Cari no. rumah, nama warga, periode (11-2026), atau catatan..."
                >
                  <template #prepend><q-icon name="search" /></template>
                </q-input>
              </div>
            </div>

            <div v-if="!pendingCards.length" class="text-center q-pa-xl text-grey-6">
              <q-icon name="verified" size="48px" color="teal-3" />
              <div class="text-subtitle1 text-weight-bold text-grey-8 q-mt-sm">Semua pembayaran sudah diverifikasi!</div>
              <div class="text-caption">Tidak ada antrean bukti transfer yang menunggu saat ini.</div>
            </div>

            <div v-else-if="!filteredPendingCards.length" class="text-center q-pa-lg text-grey-6 bg-grey-1 rounded-borders">
              Tidak ada antrean verifikasi yang cocok dengan pencarian "{{ searchPending }}".
            </div>

            <div v-else class="row q-col-gutter-md">
              <div v-for="item in filteredPendingCards" :key="item.cardKey" class="col-12 col-md-6">
                <q-card flat bordered :style="item.isBatch ? 'border-radius: 12px; border-left: 4px solid #6d28d9;' : 'border-radius: 12px; border-left: 4px solid #f59e0b;'">
                  <q-card-section>
                    <div class="row items-start justify-between">
                      <div>
                        <q-badge color="teal-8" class="q-mr-xs">{{ item.no_rumah }}</q-badge>
                        <q-badge v-if="item.isBatch" color="deep-purple-7" class="q-mr-xs">RAPEL {{ item.count }} BULAN</q-badge>
                        <q-badge color="amber-9">
                          {{ item.isBatch ? item.periodeLabel : ('Periode ' + formatPeriodeID(item.periode)) }}
                        </q-badge>
                        <div class="text-subtitle1 text-weight-bold text-grey-9 q-mt-xs">{{ item.kepala_keluarga }}</div>
                        <div class="text-caption text-grey-6">Diunggah: {{ formatDateID(item.tanggal_upload) }} · Metode: {{ item.metode_bayar || 'Transfer Bank' }}</div>
                      </div>
                      <div class="text-right">
                        <div class="text-h6 text-weight-bolder text-teal-9 mono-num">{{ formatRupiah(item.total) }}</div>
                        <div v-if="item.isBatch" class="text-caption text-deep-purple-8">Gabungan {{ item.count }} bulan</div>
                      </div>
                    </div>

                    <div v-if="item.isBatch" class="q-mt-sm q-pa-xs rounded-borders" style="background:#f5f3ff; border: 1px solid #ddd6fe;">
                      <div class="text-caption text-deep-purple-9 text-weight-bold q-mb-xs">Rincian Bulan Rapel:</div>
                      <div class="row q-gutter-xs">
                        <q-badge v-for="p in item.periods" :key="p" color="deep-purple-6" outline>{{ formatPeriodeID(p) }}</q-badge>
                      </div>
                    </div>

                    <div
                      v-if="item.rekening_tujuan"
                      class="q-mt-sm q-pa-sm rounded-borders row items-center no-wrap q-gutter-xs"
                      style="background: #f0fdfa; border: 1px solid #99f6e4;"
                    >
                      <q-icon name="account_balance" color="teal-8" size="18px" />
                      <div class="text-caption text-teal-10">
                        <span class="text-weight-medium">Rekening Tujuan:</span>
                        <strong class="mono-num q-ml-xs">{{ item.rekening_tujuan }}</strong>
                      </div>
                    </div>

                    <div v-if="item.catatan_warga" class="q-mt-sm q-pa-sm bg-grey-1 rounded-borders text-caption text-grey-8">
                      <strong>Catatan Warga:</strong> {{ item.catatan_warga }}
                    </div>

                    <div v-if="item.catatan_bendahara" class="q-mt-xs q-pa-sm bg-amber-1 rounded-borders text-caption text-amber-10" style="border-left: 3px solid #d97706;">
                      <strong>Catatan Revisi / Bendahara:</strong> {{ item.catatan_bendahara }}
                    </div>

                    <div class="q-mt-md text-center" v-if="item.bukti_url">
                      <img v-if="!item.bukti_url.endsWith('/preview')" :src="item.bukti_url" class="proof-thumb" style="max-height: 220px;" alt="Bukti transfer" />
                      <q-btn v-else outline color="indigo-8" icon="open_in_new" label="Buka File Bukti di Drive" type="a" :href="item.bukti_url" target="_blank" />
                    </div>
                    <div v-else class="q-mt-md q-pa-sm bg-amber-1 text-amber-10 text-caption rounded-borders">
                      <q-icon name="info" /> Tanpa lampiran gambar (pembayaran tunai / catatan manual).
                    </div>
                  </q-card-section>
                  <q-separator />
                  <q-card-actions class="justify-end q-pa-sm q-gutter-sm">
                    <q-btn outline color="negative" icon="close" :label="item.isBatch ? ('Tolak Semua (' + item.count + ' Bln)') : 'Tolak'" @click="openActionDialog(item, 'reject')" />
                    <q-btn unelevated color="positive" icon="check_circle" :label="item.isBatch ? ('Setujui Semua (' + item.count + ' Bln) & Catat Kas') : 'Setujui & Catat Kas'" @click="openActionDialog(item, 'approve')" />
                  </q-card-actions>
                </q-card>
              </div>
            </div>
          </q-tab-panel>

          <q-tab-panel name="history" class="q-pa-md">
            <div class="row q-col-gutter-sm q-mb-md items-center">
              <div class="col-12 col-sm-6">
                <q-input
                  v-model="searchHistory"
                  outlined dense clearable
                  placeholder="Cari no. rumah, nama warga, periode (11-2026), verifikator, atau catatan..."
                >
                  <template #prepend><q-icon name="search" /></template>
                </q-input>
              </div>
              <div class="col-6 col-sm-3">
                <q-select
                  v-model="filterHistoryPeriode"
                  :options="historyPeriodeOptions"
                  option-value="value"
                  option-label="label"
                  emit-value map-options
                  outlined dense
                  label="Filter Periode"
                />
              </div>
              <div class="col-6 col-sm-3">
                <q-select
                  v-model="filterHistoryStatus"
                  :options="['Semua', 'Lunas', 'Ditolak']"
                  outlined dense
                  label="Filter Hasil"
                />
              </div>
            </div>
            <div v-if="searchHistory || filterHistoryPeriode || filterHistoryStatus !== 'Semua'" class="text-caption text-grey-7 q-mb-sm">
              Menampilkan <strong>{{ filteredHistoryList.length }}</strong> dari {{ historyList.length }} riwayat verifikasi
            </div>
            <q-table flat bordered :rows="filteredHistoryList" :columns="histColumns" :row-key="row => row._row_num || row.id" :pagination="{ rowsPerPage: 15 }">
              <template #body-cell-periode="props">
                <q-td :props="props">
                  <span>{{ formatPeriodeID(props.row.periode) }}</span>
                  <q-badge v-if="props.row.batch_id" color="deep-purple-7" class="q-ml-xs" style="font-size:10px">Rapel</q-badge>
                </q-td>
              </template>
              <template #body-cell-rekening_tujuan="props">
                <q-td :props="props" class="mono-num text-caption">
                  <span v-if="props.row.rekening_tujuan" class="text-teal-9 text-weight-medium">{{ props.row.rekening_tujuan }}</span>
                  <span v-else class="text-grey-7">{{ props.row.metode_bayar || '-' }}</span>
                </q-td>
              </template>
              <template #body-cell-total="props">
                <q-td :props="props" class="mono-num text-weight-bold">{{ formatRupiah(props.row.total) }}</q-td>
              </template>
              <template #body-cell-status="props">
                <q-td :props="props">
                  <q-badge :color="props.row.status === 'Lunas' ? 'positive' : 'negative'">{{ props.row.status }}</q-badge>
                </q-td>
              </template>
              <template #body-cell-actions="props">
                <q-td :props="props" class="text-right">
                  <q-btn
                    v-if="canRevert"
                    outline dense size="sm"
                    color="amber-9"
                    icon="undo"
                    label="Revisi"
                    @click="openActionDialog(props.row, 'revert')"
                  >
                    <q-tooltip>Batalkan keputusan / kembalikan ke verifikasi ulang</q-tooltip>
                  </q-btn>
                </q-td>
              </template>
            </q-table>
          </q-tab-panel>
        </q-tab-panels>
      </q-card>

      <!-- Dialog Konfirmasi Setuju / Tolak / Revisi -->
      <q-dialog v-model="actionDialog" persistent>
        <q-card style="width: 480px; max-width: 95vw;">
          <q-card-section
            :class="actionType === 'approve' ? 'bg-positive text-white' : (actionType === 'revert' ? 'bg-amber-9 text-white' : 'bg-negative text-white')"
            class="row items-center justify-between"
          >
            <div class="text-subtitle1 text-weight-bold">
              {{ actionType === 'approve' ? 'Setujui Pembayaran IPL' : (actionType === 'revert' ? 'Revisi / Verifikasi Ulang IPL' : 'Tolak Bukti Pembayaran') }}
            </div>
            <q-btn flat round dense icon="close" v-close-popup />
          </q-card-section>
          <q-card-section>
            <div class="q-mb-md">
              <div><strong>Rumah {{ selectedItem.no_rumah }}</strong> — {{ selectedItem.kepala_keluarga }}</div>
              <div class="text-caption text-grey-7">
                {{ selectedItem.isBatch ? ('Paket Rapel ' + selectedItem.count + ' Bulan (' + selectedItem.periodeLabel + ')') : ('Periode ' + formatPeriodeID(selectedItem.periode)) }} · Nominal {{ formatRupiah(selectedItem.total) }}
                <q-badge v-if="actionType === 'revert'" class="q-ml-xs" :color="selectedItem.status === 'Lunas' ? 'positive' : 'negative'">{{ selectedItem.status }}</q-badge>
              </div>
              <div v-if="selectedItem.rekening_tujuan" class="text-caption text-teal-9 text-weight-bold mono-num q-mt-xs">
                <q-icon name="account_balance" size="14px" class="q-mr-xs" />Tujuan: {{ selectedItem.rekening_tujuan }}
              </div>
            </div>
            <q-banner v-if="actionType === 'approve'" dense rounded class="bg-teal-1 text-teal-10 q-mb-md">
              <span v-if="selectedItem.isBatch">
                Seluruh <strong>{{ selectedItem.count }} bulan</strong> dalam paket rapel akan ditandai <strong>Lunas</strong> dan <strong>1 transaksi Kas Masuk gabungan ({{ formatRupiah(selectedItem.total) }})</strong> akan otomatis tercatat di Buku Kas.
              </span>
              <span v-else>
                Tagihan akan ditandai <strong>Lunas</strong> dan transaksi <strong>Kas Masuk (IPL Bulanan)</strong> akan otomatis tercatat di Buku Kas.
              </span>
            </q-banner>
            <q-banner v-if="actionType === 'revert' && selectedItem.status === 'Lunas'" dense rounded class="bg-amber-1 text-amber-10 q-mb-md" style="border: 1px solid #fcd34d;">
              <template #avatar><q-icon name="warning" color="amber-9" /></template>
              Status <strong>Lunas</strong> akan dibatalkan dan <strong>transaksi Kas Masuk IPL terkait akan otomatis dihapus</strong> dari Buku Kas agar saldo tetap akurat.
              <span v-if="selectedItem.batch_id"> (Karena ini bagian dari paket <strong>Rapel</strong>, seluruh bulan dalam paket rapel yang sama akan ikut direvisi agar saldo kas tetap sinkron.)</span>
            </q-banner>
            <q-option-group
              v-if="actionType === 'revert'"
              v-model="revertTargetStatus"
              :options="[
                { label: 'Kembalikan ke Antrean Verifikasi Ulang (bukti lama tetap tersimpan)', value: 'Menunggu Verifikasi' },
                { label: 'Kembalikan ke Belum Bayar (warga perlu unggah bukti ulang)', value: 'Belum Bayar' }
              ]"
              color="amber-9"
              dense
              class="q-mb-md text-body2"
            />
            <q-input
              v-model="catatanBendahara"
              outlined dense
              type="textarea"
              rows="3"
              :label="actionType === 'approve' ? 'Catatan Bendahara (Opsional)' : (actionType === 'revert' ? 'Alasan Revisi / Salah Klik (Wajib diisi) *' : 'Alasan Penolakan (Wajib diisi) *')"
              :placeholder="actionType === 'approve' ? 'Mutasi BCA sesuai' : (actionType === 'revert' ? 'Contoh: Salah klik setujui, bukti transfer perlu dicek ulang' : 'Contoh: Nominal transfer kurang / foto bukti buram')"
            />
            <div class="row justify-end q-gutter-sm q-mt-md">
              <q-btn flat label="Batal" v-close-popup />
              <q-btn
                unelevated
                :color="actionType === 'approve' ? 'positive' : (actionType === 'revert' ? 'amber-9' : 'negative')"
                :label="actionType === 'approve' ? 'Konfirmasi Lunas' : (actionType === 'revert' ? 'Ya, Revisi Sekarang' : 'Tolak Bukti')"
                :loading="saving"
                @click="submitVerify"
              />
            </div>
          </q-card-section>
        </q-card>
      </q-dialog>
    </div>
  `,
  setup(props, { emit }) {
    const { ref, computed, onMounted } = Vue;
    const $q = Quasar.useQuasar();
    const tab = ref('pending');
    const loading = ref(false);
    const saving = ref(false);
    const allRows = ref([]);
    const searchPending = ref('');
    const searchHistory = ref('');
    const filterHistoryStatus = ref('Semua');
    const filterHistoryPeriode = ref('');
    const actionDialog = ref(false);
    const actionType = ref('approve');
    const selectedItem = ref({});
    const catatanBendahara = ref('');
    const revertTargetStatus = ref('Menunggu Verifikasi');

    const canRevert = computed(() => {
      if (!props.user) return false;
      if (props.user.role === 'superadmin') return true;
      const cfg = SiwargaAPI.parseMenuConfig(props.settings || {});
      const allowed = (cfg._permissions && Array.isArray(cfg._permissions.verif_revisi_roles))
        ? cfg._permissions.verif_revisi_roles
        : ['superadmin', 'admin', 'bendahara'];
      const eff = SiwargaAPI.getEffectiveRole(props.user, props.settings || {});
      return allowed.indexOf(props.user.role) !== -1 || allowed.indexOf(eff) !== -1;
    });

    const pendingList = computed(() => allRows.value.filter(r => String(r.status || '').trim() === 'Menunggu Verifikasi'));
    const pendingCards = computed(() => {
      const grouped = {};
      const singles = [];
      pendingList.value.forEach(r => {
        if (r.batch_id) {
          if (!grouped[r.batch_id]) grouped[r.batch_id] = [];
          grouped[r.batch_id].push(r);
        } else {
          singles.push(r);
        }
      });
      const cards = [];
      Object.keys(grouped).forEach(bid => {
        const list = grouped[bid].slice().sort((a, b) => String(a.periode || '').localeCompare(String(b.periode || '')));
        if (list.length === 1) {
          cards.push(Object.assign({ cardKey: list[0].id, isBatch: false, count: 1 }, list[0]));
        } else {
          const first = list[0];
          const last = list[list.length - 1];
          const totalSum = list.reduce((s, x) => s + Number(x.total || x.nominal || 0), 0);
          const periods = list.map(x => x.periode);
          cards.push(Object.assign({}, first, {
            cardKey: 'BATCH-' + bid,
            isBatch: true,
            batch_id: bid,
            count: list.length,
            periods: periods,
            periodeLabel: SiwargaAPI.formatPeriodsSummary(periods, false),
            total: totalSum
          }));
        }
      });
      singles.forEach(r => {
        cards.push(Object.assign({ cardKey: r.id, isBatch: false, count: 1 }, r));
      });
      return cards;
    });
    const filteredPendingCards = computed(() => {
      const q = String(searchPending.value || '').trim().toLowerCase();
      if (!q) return pendingCards.value;
      return pendingCards.value.filter(item => {
        const fields = [
          item.no_rumah,
          item.kepala_keluarga,
          item.periode,
          SiwargaAPI.formatPeriodeID(item.periode),
          item.periodeLabel,
          item.rekening_tujuan,
          item.metode_bayar,
          item.catatan_warga,
          item.catatan_bendahara
        ];
        return fields.some(v => String(v || '').toLowerCase().includes(q));
      });
    });

    const historyList = computed(() => allRows.value.filter(r => {
      const s = String(r.status || '').trim().toLowerCase();
      return s === 'lunas' || s === 'ditolak';
    }));

    const historyPeriodeOptions = computed(() => {
      const set = {};
      historyList.value.forEach(r => {
        if (r.periode) set[String(r.periode)] = true;
      });
      const list = Object.keys(set).sort().reverse().map(ym => ({
        value: ym,
        label: SiwargaAPI.formatPeriodeID(ym)
      }));
      return [{ value: '', label: 'Semua Periode' }].concat(list);
    });

    const filteredHistoryList = computed(() => {
      const q = String(searchHistory.value || '').trim().toLowerCase();
      return historyList.value.filter(r => {
        if (filterHistoryStatus.value !== 'Semua' && String(r.status || '').trim() !== filterHistoryStatus.value) return false;
        if (filterHistoryPeriode.value && String(r.periode || '').trim() !== filterHistoryPeriode.value) return false;
        if (!q) return true;
        const fields = [
          r.no_rumah,
          r.kepala_keluarga,
          r.periode,
          SiwargaAPI.formatPeriodeID(r.periode),
          r.rekening_tujuan,
          r.metode_bayar,
          r.diverifikasi_oleh,
          r.catatan_bendahara,
          r.status,
          SiwargaAPI.formatDateID(r.tanggal_verifikasi)
        ];
        return fields.some(v => String(v || '').toLowerCase().includes(q));
      });
    });

    const histColumns = [
      { name: 'periode', label: 'Periode', field: 'periode', align: 'left', sortable: true, format: val => SiwargaAPI.formatPeriodeID(val) },
      { name: 'no_rumah', label: 'Rumah', field: 'no_rumah', align: 'left', sortable: true },
      { name: 'kepala_keluarga', label: 'Warga', field: 'kepala_keluarga', align: 'left', sortable: true },
      { name: 'rekening_tujuan', label: 'Rekening Tujuan', field: 'rekening_tujuan', align: 'left' },
      { name: 'total', label: 'Nominal', field: 'total', align: 'right', sortable: true },
      { name: 'status', label: 'Hasil', field: 'status', align: 'center', sortable: true },
      { name: 'diverifikasi_oleh', label: 'Verifikator', field: 'diverifikasi_oleh', align: 'left' },
      { name: 'tanggal_verifikasi', label: 'Tanggal', field: 'tanggal_verifikasi', align: 'center', sortable: true, format: val => SiwargaAPI.formatDateID(val) },
      { name: 'catatan_bendahara', label: 'Catatan', field: 'catatan_bendahara', align: 'left' },
      { name: 'actions', label: 'Aksi', field: 'id', align: 'right' }
    ];

    async function loadData() {
      loading.value = true;
      try {
        allRows.value = await SiwargaAPI.call('getTagihanIpl', { periode: 'ALL' }) || [];
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loading.value = false;
      }
    }

    function openActionDialog(item, type) {
      selectedItem.value = item;
      actionType.value = type;
      revertTargetStatus.value = 'Menunggu Verifikasi';
      catatanBendahara.value = type === 'approve' ? 'Mutasi rekening terkonfirmasi' : '';
      actionDialog.value = true;
    }

    async function submitVerify() {
      if ((actionType.value === 'reject' || actionType.value === 'revert') && !catatanBendahara.value.trim()) {
        $q.notify({ type: 'warning', message: actionType.value === 'revert' ? 'Mohon isi alasan revisi.' : 'Mohon isi alasan penolakan.' });
        return;
      }
      saving.value = true;
      try {
        const res = await SiwargaAPI.call('verifyIplPayment', {
          tagihan_id: selectedItem.value.id,
          row_num: selectedItem.value._row_num || 0,
          no_rumah: selectedItem.value.no_rumah || '',
          periode: selectedItem.value.periode || '',
          kk_id: selectedItem.value.kk_id || '',
          batch_id: selectedItem.value.isBatch ? selectedItem.value.batch_id : (actionType.value === 'revert' && selectedItem.value.batch_id ? selectedItem.value.batch_id : ''),
          action: actionType.value,
          target_status: revertTargetStatus.value,
          catatan_bendahara: catatanBendahara.value
        });
        const cnt = (res && res.updatedCount && res.updatedCount > 1) ? (' (' + res.updatedCount + ' bulan)') : '';
        const emailNote = (res && res.emailResult && res.emailResult.sent)
          ? (' Notifikasi email terkirim ke ' + res.emailResult.to + '.')
          : '';
        const msg = actionType.value === 'approve'
          ? ('Pembayaran' + cnt + ' disetujui Lunas & otomatis tercatat di Kas Masuk!' + emailNote)
          : (actionType.value === 'revert'
            ? ('Verifikasi' + cnt + ' direvisi: dikembalikan ke status ' + revertTargetStatus.value + '.')
            : ('Bukti' + cnt + ' ditolak. Warga dapat mengunggah ulang bukti pembayaran.' + emailNote));
        $q.notify({ type: 'positive', message: msg });
        actionDialog.value = false;
        emit('refresh-badges');
        if (actionType.value === 'revert' && revertTargetStatus.value === 'Menunggu Verifikasi') {
          tab.value = 'pending';
        }
        await loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
        // Muat ulang otomatis agar tampilan selalu sinkron jika status di server sudah berubah
        if (err && err.message && /berstatus|direvisi|verifikasi/i.test(err.message)) {
          loadData();
        }
      } finally {
        saving.value = false;
      }
    }

    onMounted(loadData);

    return {
      tab, loading, saving, canRevert, pendingList, pendingCards, filteredPendingCards,
      historyList, filteredHistoryList, historyPeriodeOptions, histColumns,
      searchPending, searchHistory, filterHistoryStatus, filterHistoryPeriode,
      actionDialog, actionType, selectedItem, catatanBendahara, revertTargetStatus,
      loadData, openActionDialog, submitVerify,
      formatRupiah: SiwargaAPI.formatRupiah, formatDateID: SiwargaAPI.formatDateID, formatPeriodeID: SiwargaAPI.formatPeriodeID
    };
  }
};
</script>

  <script>
window.CompFinanceKas = {
  props: ['user'],
  template: `
    <div>
      <div class="row items-center justify-between q-mb-md q-col-gutter-sm">
        <div class="col-12 col-md-auto">
          <div class="text-subtitle1 text-md-h6 text-weight-bold text-grey-9">Pencatatan Kas Masuk &amp; Keluar</div>
          <div class="text-caption text-grey-6">Catat pemasukan non-IPL (donasi, sewa fasum) dan pengeluaran operasional RT lengkap dengan bukti kwitansi Drive</div>
        </div>
        <div v-if="canManage" class="col-12 col-md-auto">
          <div class="row q-gutter-xs q-gutter-sm-sm">
            <q-btn outline color="teal-8" icon="category" label="Pos Anggaran" @click="openKatDialog" />
            <q-btn unelevated color="positive" icon="add_circle" label="Kas Masuk" @click="openForm('Masuk')" />
            <q-btn unelevated color="deep-orange-7" icon="remove_circle" label="Kas Keluar" @click="openForm('Keluar')" />
          </div>
        </div>
      </div>

      <div class="row q-col-gutter-sm q-col-gutter-sm-md q-mb-md">
        <div class="col-6 col-sm-4">
          <q-card flat class="stat-card q-pa-sm q-pa-sm-md">
            <div class="text-caption text-grey-6">Kas Masuk (Filter)</div>
            <div class="text-body1 text-sm-h6 text-weight-bolder text-positive mono-num q-mt-xs">{{ formatRupiah(totals.masuk) }}</div>
          </q-card>
        </div>
        <div class="col-6 col-sm-4">
          <q-card flat class="stat-card q-pa-sm q-pa-sm-md">
            <div class="text-caption text-grey-6">Kas Keluar (Filter)</div>
            <div class="text-body1 text-sm-h6 text-weight-bolder text-negative mono-num q-mt-xs">{{ formatRupiah(totals.keluar) }}</div>
          </q-card>
        </div>
        <div class="col-12 col-sm-4">
          <q-card flat class="stat-card q-pa-sm q-pa-sm-md">
            <div class="text-caption text-grey-6">Selisih Arus Kas</div>
            <div class="text-subtitle1 text-sm-h6 text-weight-bolder mono-num q-mt-xs" :class="totals.net >= 0 ? 'text-teal-9' : 'text-negative'">{{ formatRupiah(totals.net) }}</div>
          </q-card>
        </div>
      </div>

      <q-card flat class="surface-card q-pa-sm q-pa-sm-md">
        <div class="row q-col-gutter-sm q-mb-md">
          <div class="col-12 col-sm-3">
            <q-select v-model="filterTipe" :options="['Semua', 'Masuk', 'Keluar']" outlined dense label="Tipe Transaksi" />
          </div>
          <div class="col-12 col-sm-4">
            <q-select
              v-model="filterBulan"
              :options="periodeFilterOptions"
              option-value="value"
              option-label="label"
              emit-value
              map-options
              outlined
              dense
              label="Filter Bulan"
            />
          </div>
          <div class="col-12 col-sm-5">
            <q-input v-model="search" outlined dense clearable placeholder="Cari deskripsi, kategori, pencatat...">
              <template #prepend><q-icon name="search" /></template>
            </q-input>
          </div>
        </div>

        <!-- Tampilan Kartu Rapi untuk HP & Tablet (Tanpa Geser Kanan-Kiri) -->
        <div v-if="$q.screen.lt.md">
          <div v-if="loading" class="text-center q-pa-lg">
            <q-spinner color="teal-8" size="32px" />
            <div class="text-caption text-grey-6 q-mt-sm">Memuat transaksi arus kas...</div>
          </div>
          <div v-else-if="!filteredRows.length" class="text-center q-pa-lg text-grey-6">
            <q-icon name="swap_vert" size="40px" color="grey-4" />
            <div class="text-body2 q-mt-xs">Belum ada transaksi kas pada filter ini.</div>
          </div>
          <div v-else class="q-gutter-sm">
            <div
              v-for="row in filteredRows.slice(0, mobileLimit)"
              :key="row.id"
              class="ipl-mobile-card"
              :style="row.tipe === 'Masuk' ? 'border-left: 4px solid #16a34a;' : 'border-left: 4px solid #ea580c;'"
            >
              <div class="row items-center justify-between no-wrap q-gutter-xs q-mb-xs">
                <div class="row items-center q-gutter-xs ellipsis">
                  <q-badge :color="row.tipe === 'Masuk' ? 'positive' : 'deep-orange-7'">{{ row.tipe }}</q-badge>
                  <span class="text-caption text-grey-7 text-weight-medium">{{ formatDateID(row.tanggal) }}</span>
                </div>
                <div class="text-subtitle2 text-weight-bolder mono-num" :class="row.tipe === 'Masuk' ? 'text-positive' : 'text-negative'">
                  {{ row.tipe === 'Masuk' ? '+' : '-' }} {{ formatRupiah(row.nominal) }}
                </div>
              </div>

              <div class="text-caption text-teal-9 text-weight-bold">{{ row.kategori }}</div>
              <div class="text-body2 text-grey-9 q-mt-xs" style="line-height: 1.4; word-break: break-word;">
                {{ row.deskripsi }}
              </div>

              <div class="row items-center justify-between q-mt-sm q-pt-xs" style="border-top: 1px dashed #e2e8f0;">
                <div class="text-caption text-grey-6 ellipsis q-pr-xs">
                  {{ row.metode || 'Tunai' }} · {{ row.dicatat_oleh || '-' }}
                </div>
                <div class="row items-center q-gutter-xs no-wrap">
                  <q-chip v-if="row.referensi_id" dense size="xs" color="teal-1" text-color="teal-9" class="q-ma-none">Auto IPL</q-chip>
                  <q-btn v-if="row.bukti_url" outline dense no-caps size="xs" icon="receipt" label="Bukti" color="teal-8" @click="viewBukti(row)" />
                  <q-btn v-if="canManage && !row.referensi_id" flat dense round size="sm" icon="edit" color="indigo-7" @click="openForm(row.tipe, row)" />
                  <q-btn v-if="canManage && !row.referensi_id" flat dense round size="sm" icon="delete" color="negative" @click="deleteTx(row)" />
                </div>
              </div>
            </div>

            <div v-if="filteredRows.length > mobileLimit" class="text-center q-pt-sm">
              <q-btn
                outline no-caps color="teal-8" size="sm"
                :label="'Tampilkan lebih banyak (' + (filteredRows.length - mobileLimit) + ' lagi)'"
                @click="mobileLimit += 20"
              />
            </div>
          </div>
        </div>

        <!-- Tampilan Tabel Lengkap untuk Laptop / Desktop -->
        <q-table v-else flat bordered :rows="filteredRows" :columns="columns" row-key="id" :loading="loading" :pagination="{ rowsPerPage: 12 }">
          <template #body-cell-tipe="props">
            <q-td :props="props">
              <q-badge :color="props.row.tipe === 'Masuk' ? 'positive' : 'deep-orange-7'">{{ props.row.tipe }}</q-badge>
            </q-td>
          </template>
          <template #body-cell-nominal="props">
            <q-td :props="props" class="mono-num text-weight-bold" :class="props.row.tipe === 'Masuk' ? 'text-positive' : 'text-negative'">
              {{ props.row.tipe === 'Masuk' ? '+' : '-' }} {{ formatRupiah(props.row.nominal) }}
            </q-td>
          </template>
          <template #body-cell-actions="props">
            <q-td :props="props" class="q-gutter-xs">
              <q-btn v-if="props.row.bukti_url" flat dense round icon="receipt" color="teal-8" @click="viewBukti(props.row)"><q-tooltip>Lihat Kwitansi</q-tooltip></q-btn>
              <q-btn v-if="canManage && !props.row.referensi_id" flat dense round icon="edit" color="indigo-7" @click="openForm(props.row.tipe, props.row)" />
              <q-btn v-if="canManage && !props.row.referensi_id" flat dense round icon="delete" color="negative" @click="deleteTx(props.row)" />
              <q-chip v-if="props.row.referensi_id" dense size="xs" color="teal-1" text-color="teal-9">Auto IPL</q-chip>
            </q-td>
          </template>
        </q-table>
      </q-card>

      <!-- Dialog Catat Kas -->
      <q-dialog v-model="dialog" persistent>
        <q-card style="width: 520px; max-width: 95vw;">
          <q-card-section :class="form.tipe === 'Masuk' ? 'bg-positive text-white' : 'bg-deep-orange-7 text-white'" class="row items-center justify-between">
            <div class="text-subtitle1 text-weight-bold">{{ form.id ? 'Edit Transaksi Kas' : ('Catat Kas ' + form.tipe) }}</div>
            <q-btn flat round dense icon="close" v-close-popup />
          </q-card-section>
          <q-card-section>
            <q-form @submit.prevent="submitForm" class="q-gutter-sm">
              <div class="row q-col-gutter-sm">
                <div class="col-6"><q-input v-model="form.tanggal" type="date" outlined dense label="Tanggal *" :rules="[v=>!!v||'Wajib']" /></div>
                <div class="col-6"><q-select v-model="form.tipe" :options="['Masuk', 'Keluar']" outlined dense label="Tipe Kas" @update:model-value="onTipeChange" /></div>
                <div class="col-12 col-sm-7">
                  <q-select
                    v-model="form.kategori"
                    :options="activeKategoriOptions"
                    outlined dense label="Kategori Pos Anggaran *"
                    :rules="[v=>!!v||'Pilih kategori']"
                  >
                    <template #after v-if="canManage">
                      <q-btn flat dense round icon="tune" color="teal-8" @click="openKatDialog">
                        <q-tooltip>Kelola Kategori Pos Anggaran</q-tooltip>
                      </q-btn>
                    </template>
                  </q-select>
                </div>
                <div class="col-12 col-sm-5">
                  <q-select v-model="form.metode" :options="['Tunai', 'Transfer Bank', 'QRIS']" outlined dense label="Metode" />
                </div>
              </div>
              <q-input v-model.number="form.nominal" type="number" outlined dense label="Nominal (Rp) *" :rules="[v=>v>0||'Nominal harus > 0']" />
              <q-input v-model="form.deskripsi" type="textarea" rows="3" outlined dense label="Uraian / Keterangan Transaksi *" :rules="[v=>!!v||'Wajib']" />
              <q-file v-model="uploadFile" outlined dense clearable accept=".jpg,.jpeg,.png,.webp,.pdf" label="Upload Foto Nota / Kwitansi ke Google Drive (Opsional)">
                <template #prepend><q-icon name="receipt_long" /></template>
              </q-file>
              <div class="row justify-end q-gutter-sm q-mt-md">
                <q-btn flat label="Batal" v-close-popup />
                <q-btn type="submit" unelevated :color="form.tipe === 'Masuk' ? 'positive' : 'deep-orange-7'" label="Simpan Transaksi" :loading="saving" />
              </div>
            </q-form>
          </q-card-section>
        </q-card>
      </q-dialog>

      <!-- Dialog Kelola Kategori Pos Anggaran -->
      <q-dialog v-model="katDialog" persistent>
        <q-card style="width: 680px; max-width: 96vw;">
          <q-card-section class="bg-teal-8 text-white row items-center justify-between">
            <div>
              <div class="text-subtitle1 text-weight-bold">Kelola Kategori Pos Anggaran</div>
              <div class="text-caption text-teal-1">Tambah, edit, atau aktif/nonaktifkan kategori Kas Masuk &amp; Kas Keluar</div>
            </div>
            <q-btn flat round dense icon="close" v-close-popup />
          </q-card-section>
          <q-card-section class="q-gutter-md">
            <!-- Form Tambah / Edit Kategori -->
            <q-form @submit.prevent="submitKategori" class="q-pa-md rounded-borders bg-grey-1" style="border: 1px solid #e2e8f0;">
              <div class="row items-center justify-between q-mb-sm">
                <div class="text-subtitle2 text-weight-bold text-teal-9">
                  {{ katForm.id ? 'Edit Kategori Pos Anggaran' : 'Tambah Kategori Pos Anggaran Baru' }}
                </div>
                <q-btn v-if="katForm.id" flat dense size="sm" color="grey-7" label="Batal Edit" @click="resetKatForm" />
              </div>
              <div class="row q-col-gutter-sm">
                <div class="col-12 col-sm-3">
                  <q-select v-model="katForm.tipe" :options="['Masuk', 'Keluar']" outlined dense bg-color="white" label="Tipe Kas *" />
                </div>
                <div class="col-12 col-sm-5">
                  <q-input v-model="katForm.nama" outlined dense bg-color="white" label="Nama Pos Anggaran *" :rules="[v=>!!v||'Wajib diisi']" placeholder="Misal: Dana 17 Agustus" />
                </div>
                <div class="col-12 col-sm-4">
                  <q-select v-model="katForm.status" :options="['Aktif', 'Nonaktif']" outlined dense bg-color="white" label="Status" />
                </div>
                <div class="col-12 col-sm-9">
                  <q-input v-model="katForm.keterangan" outlined dense bg-color="white" label="Keterangan (Opsional)" placeholder="Deskripsi singkat penggunaan pos anggaran" />
                </div>
                <div class="col-12 col-sm-3 row items-center justify-end">
                  <q-btn type="submit" unelevated color="teal-8" :icon="katForm.id ? 'save' : 'add'" :label="katForm.id ? 'Simpan' : 'Tambah'" class="full-width" :loading="savingKat" />
                </div>
              </div>
            </q-form>

            <!-- Filter & Daftar Kategori -->
            <div class="row items-center justify-between q-gutter-sm">
              <q-btn-toggle
                v-model="katFilterTipe"
                dense unelevated toggle-color="teal-8" color="grey-2" text-color="grey-8"
                :options="[{label:'Semua (' + kategoriList.length + ')', value:'Semua'}, {label:'Kas Masuk', value:'Masuk'}, {label:'Kas Keluar', value:'Keluar'}]"
              />
              <div class="text-caption text-grey-6">Kategori <strong>Nonaktif</strong> disembunyikan dari form catat kas baru.</div>
            </div>

            <q-list bordered separator class="rounded-borders" style="max-height: 300px; overflow-y: auto;">
              <q-item v-for="k in filteredKategoriList" :key="k.id" dense class="q-py-xs">
                <q-item-section avatar>
                  <q-badge :color="k.tipe === 'Masuk' ? 'positive' : 'deep-orange-7'">{{ k.tipe }}</q-badge>
                </q-item-section>
                <q-item-section>
                  <q-item-label class="text-weight-bold" :class="k.status === 'Nonaktif' ? 'text-grey-5 text-strike' : 'text-grey-9'">
                    {{ k.nama }}
                    <q-badge class="q-ml-xs" :color="k.status === 'Aktif' ? 'teal-7' : 'grey-5'">{{ k.status }}</q-badge>
                  </q-item-label>
                  <q-item-label caption v-if="k.keterangan">{{ k.keterangan }}</q-item-label>
                </q-item-section>
                <q-item-section side>
                  <div class="row items-center q-gutter-xs">
                    <q-btn flat dense round size="sm" icon="edit" color="indigo-7" @click="editKategori(k)">
                      <q-tooltip>Edit Kategori</q-tooltip>
                    </q-btn>
                    <q-toggle
                      :model-value="k.status === 'Aktif'"
                      color="teal-8"
                      dense
                      @update:model-value="val => toggleKategori(k, val)"
                    >
                      <q-tooltip>{{ k.status === 'Aktif' ? 'Nonaktifkan' : 'Aktifkan' }}</q-tooltip>
                    </q-toggle>
                  </div>
                </q-item-section>
              </q-item>
              <q-item v-if="!filteredKategoriList.length">
                <q-item-section class="text-center text-grey-6 q-py-md">Belum ada kategori pada filter ini.</q-item-section>
              </q-item>
            </q-list>
          </q-card-section>
          <q-card-actions align="right" class="q-px-md q-pb-md">
            <q-btn flat label="Tutup" v-close-popup />
          </q-card-actions>
        </q-card>
      </q-dialog>

      <!-- Dialog Lihat Nota -->
      <q-dialog v-model="buktiDialog">
        <q-card style="width: 520px; max-width: 95vw;">
          <q-card-section class="bg-grey-9 text-white row items-center justify-between">
            <div class="text-subtitle1 text-weight-bold">Bukti Transaksi Kas</div>
            <q-btn flat round dense icon="close" v-close-popup />
          </q-card-section>
          <q-card-section class="text-center">
            <img v-if="buktiItem.bukti_url && !buktiItem.bukti_url.endsWith('/preview')" :src="buktiItem.bukti_url" class="proof-thumb" alt="Nota kas" />
            <q-btn v-else color="teal-8" icon="open_in_new" label="Buka Bukti di Google Drive" type="a" :href="buktiItem.bukti_url" target="_blank" />
            <div class="text-caption text-grey-7 q-mt-sm">{{ buktiItem.deskripsi }} ({{ formatRupiah(buktiItem.nominal) }})</div>
          </q-card-section>
        </q-card>
      </q-dialog>
    </div>
  `,
  setup(props) {
    const { ref, reactive, computed, onMounted } = Vue;
    const $q = Quasar.useQuasar();
    const canManage = computed(() => SiwargaAPI.isFinanceStaff(props.user));
    const loading = ref(false);
    const saving = ref(false);
    const list = ref([]);
    const filterTipe = ref('Semua');
    const filterBulan = ref('');
    const periodeFilterOptions = SiwargaAPI.buildPeriodeOptions(true);
    const search = ref('');
    const mobileLimit = ref(20);
    const dialog = ref(false);
    const uploadFile = ref(null);
    const buktiDialog = ref(false);
    const buktiItem = ref({});
    const kategoriList = ref([]);
    const katDialog = ref(false);
    const katFilterTipe = ref('Semua');
    const savingKat = ref(false);
    const katForm = reactive({ id: '', tipe: 'Keluar', nama: '', keterangan: '', status: 'Aktif' });

    const kategoriMasuk = computed(() =>
      kategoriList.value.filter(k => k.tipe === 'Masuk' && k.status === 'Aktif').map(k => k.nama)
    );
    const kategoriKeluar = computed(() =>
      kategoriList.value.filter(k => k.tipe === 'Keluar' && k.status === 'Aktif').map(k => k.nama)
    );
    const activeKategoriOptions = computed(() => {
      const opts = (form.tipe === 'Masuk' ? kategoriMasuk.value : kategoriKeluar.value).slice();
      // Jika sedang edit transaksi lama dengan kategori yang kini nonaktif, tetap tampilkan agar tidak hilang
      if (form.id && form.kategori && opts.indexOf(form.kategori) === -1) {
        opts.unshift(form.kategori);
      }
      return opts;
    });
    const filteredKategoriList = computed(() => {
      if (katFilterTipe.value === 'Semua') return kategoriList.value;
      return kategoriList.value.filter(k => k.tipe === katFilterTipe.value);
    });

    const form = reactive({ id: '', tanggal: '', tipe: 'Keluar', kategori: '', deskripsi: '', nominal: 0, metode: 'Tunai', bukti_url: '', bukti_id: '' });

    const columns = [
      { name: 'tanggal', label: 'Tanggal', field: 'tanggal', align: 'left', sortable: true, format: val => SiwargaAPI.formatDateID(val) },
      { name: 'tipe', label: 'Tipe', field: 'tipe', align: 'center' },
      { name: 'kategori', label: 'Kategori', field: 'kategori', align: 'left', sortable: true },
      { name: 'deskripsi', label: 'Deskripsi', field: 'deskripsi', align: 'left' },
      { name: 'metode', label: 'Metode', field: 'metode', align: 'center' },
      { name: 'nominal', label: 'Nominal', field: 'nominal', align: 'right', sortable: true },
      { name: 'dicatat_oleh', label: 'Pencatat', field: 'dicatat_oleh', align: 'left' },
      { name: 'actions', label: 'Aksi', field: 'id', align: 'right' }
    ];

    const filteredRows = computed(() => {
      const q = (search.value || '').toLowerCase();
      return list.value.filter(r => {
        if (filterTipe.value !== 'Semua' && r.tipe !== filterTipe.value) return false;
        if (filterBulan.value && !String(r.tanggal || '').startsWith(filterBulan.value)) return false;
        if (!q) return true;
        return [r.kategori, r.deskripsi, r.dicatat_oleh, r.metode].some(v => String(v || '').toLowerCase().includes(q));
      });
    });

    const totals = computed(() => {
      let masuk = 0, keluar = 0;
      filteredRows.value.forEach(r => {
        if (r.tipe === 'Masuk') masuk += Number(r.nominal || 0);
        else keluar += Number(r.nominal || 0);
      });
      return { masuk, keluar, net: masuk - keluar };
    });

    async function loadData() {
      loading.value = true;
      try {
        const [kasRes, katRes] = await Promise.all([
          SiwargaAPI.call('getKasList'),
          SiwargaAPI.call('getKategoriKas')
        ]);
        list.value = kasRes || [];
        kategoriList.value = katRes || [];
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        loading.value = false;
      }
    }

    function onTipeChange(newTipe) {
      const opts = newTipe === 'Masuk' ? kategoriMasuk.value : kategoriKeluar.value;
      if (opts.indexOf(form.kategori) === -1) {
        form.kategori = opts[0] || '';
      }
    }

    function openForm(tipe, row) {
      uploadFile.value = null;
      if (row) {
        Object.assign(form, row);
      } else {
        const opts = tipe === 'Masuk' ? kategoriMasuk.value : kategoriKeluar.value;
        const defaultKat = tipe === 'Masuk'
          ? (opts.find(n => n !== 'IPL Bulanan') || opts[0] || '')
          : (opts[0] || '');
        Object.assign(form, {
          id: '', tanggal: new Date().toISOString().substring(0, 10), tipe: tipe,
          kategori: defaultKat,
          deskripsi: '', nominal: 0, metode: 'Tunai', bukti_url: '', bukti_id: ''
        });
      }
      dialog.value = true;
    }

    function resetKatForm() {
      Object.assign(katForm, { id: '', tipe: 'Keluar', nama: '', keterangan: '', status: 'Aktif' });
    }

    function openKatDialog() {
      resetKatForm();
      katDialog.value = true;
    }

    function editKategori(k) {
      Object.assign(katForm, { id: k.id, tipe: k.tipe, nama: k.nama, keterangan: k.keterangan || '', status: k.status || 'Aktif' });
    }

    async function submitKategori() {
      savingKat.value = true;
      try {
        await SiwargaAPI.call('saveKategoriKas', Object.assign({}, katForm));
        $q.notify({ type: 'positive', message: katForm.id ? 'Kategori pos anggaran diperbarui.' : 'Kategori pos anggaran baru ditambahkan.' });
        resetKatForm();
        kategoriList.value = await SiwargaAPI.call('getKategoriKas') || [];
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        savingKat.value = false;
      }
    }

    async function toggleKategori(k, isActive) {
      const nextStatus = isActive ? 'Aktif' : 'Nonaktif';
      try {
        const updated = await SiwargaAPI.call('toggleKategoriKas', { id: k.id, status: nextStatus });
        k.status = updated.status;
        $q.notify({ type: 'info', message: 'Kategori "' + k.nama + '" kini ' + updated.status + '.' });
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      }
    }

    async function submitForm() {
      saving.value = true;
      try {
        const payload = Object.assign({}, form);
        if (uploadFile.value) {
          payload.filePayload = await SiwargaAPI.readFileAsPayload(uploadFile.value);
        }
        await SiwargaAPI.call('saveKasTransaction', payload);
        $q.notify({ type: 'positive', message: 'Transaksi kas berhasil disimpan.' });
        dialog.value = false;
        loadData();
      } catch (err) {
        $q.notify({ type: 'negative', message: err.message });
      } finally {
        saving.value = false;
      }
    }

    function deleteTx(row) {
      $q.dialog({ title: 'Hapus Transaksi Kas?', message: row.deskripsi + ' (' + SiwargaAPI.formatRupiah(row.nominal) + ')', cancel: true }).onOk(async () => {
        try {
          await SiwargaAPI.call('deleteKasTransaction', { id: row.id });
          $q.notify({ type: 'positive', message: 'Transaksi kas dihapus.' });
          loadData();
        } catch (err) {
          $q.notify({ type: 'negative', message: err.message });
        }
      });
    }

    function viewBukti(row) {
      buktiItem.value = row;
      buktiDialog.value = true;
    }

    onMounted(loadData);

    return {
      canManage, loading, saving, filterTipe, filterBulan, periodeFilterOptions, search, mobileLimit,
      columns, filteredRows, totals, dialog, form, uploadFile,
      kategoriMasuk, kategoriKeluar, activeKategoriOptions,

      const s = String(ym || '').trim();
      if (!/^\d{4}-\d{2}$/.test(s)) return s || '-';
      const p = s.split('-');
      const mIdx = parseInt(p[1], 10) - 1;

          existing.addEventListener('load', () => resolve());
          existing.addEventListener('error', () => reject(new Error('Gagal memuat library PDF.')));

        s.src = src;
        s.onload = () => { s.setAttribute('data-loaded', 'true'); resolve(); };

        document.head.appendChild(s);

    }

        const namaLingk = cfg.nama_lingkungan || 'Perumahan Griya Kedaung Asri';
        const kelKota = [cfg.kelurahan, cfg.kota].filter(Boolean).join(', ');
        const periodeLabel = activePeriodLabel.value;
        const nowD = new Date();
        const todayStr =
          String(nowD.getDate()).padStart(2, '0') + '-' +
          String(nowD.getMonth() + 1).padStart(2, '0') + '-' +
          nowD.getFullYear();

        // Header Kop Resmi
        doc.setFillColor(15, 118, 110);
        doc.rect(margin, 12, contentW, 22, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.text('LAPORAN BUKU KAS KEUANGAN ' + String(namaRt).toUpperCase(), pageW / 2, 20, { align: 'center' });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9.5);
        doc.text(namaLingk + (kelKota ? (' · ' + kelKota) : ''), pageW / 2, 26, { align: 'center' });
        doc.setFontSize(8.5);
        doc.text('Periode: ' + periodeLabel + '   |   Diunduh: ' + todayStr + (usr.nama ? (' oleh ' + usr.nama) : ''), pageW / 2, 31, { align: 'center' });

        // 4 Kartu Ringkasan Saldo
        const boxY = 38;
        const gap = 3;
        const boxW = (contentW - gap * 3) / 4;
        const boxH = 15;
        const boxes = [
          { label: 'Saldo Awal Periode', val: SiwargaAPI.formatRupiah(report.saldoAwalPeriode), bg: [241, 245, 249], txt: [30, 41, 59] },
          { label: 'Total Penerimaan', val: '+ ' + SiwargaAPI.formatRupiah(report.totalMasuk), bg: [236, 253, 245], txt: [21, 128, 61] },
          { label: 'Total Pengeluaran', val: '- ' + SiwargaAPI.formatRupiah(report.totalKeluar), bg: [255, 247, 237], txt: [194, 65, 12] },
          { label: 'Saldo Akhir Kas', val: SiwargaAPI.formatRupiah(report.saldoAkhir), bg: [240, 253, 250], txt: [15, 118, 110] }
        ];
        boxes.forEach((b, i) => {
          const bx = margin + i * (boxW + gap);
          doc.setFillColor(b.bg[0], b.bg[1], b.bg[2]);
          doc.setDrawColor(203, 213, 225);
          doc.roundedRect(bx, boxY, boxW, boxH, 2, 2, 'FD');
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.5);
          doc.setTextColor(100, 116, 139);
          doc.text(b.label, bx + 3, boxY + 5.2);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9.5);
          doc.setTextColor(b.txt[0], b.txt[1], b.txt[2]);
          doc.text(b.val, bx + 3, boxY + 11.5);

        // Catatan Dana Rapel Bulan Berikutnya (jika ada)

          doc.setDrawColor(221, 214, 254);
          doc.roundedRect(margin, boxY + boxH + 3, contentW, 9.5, 1.5, 1.5, 'FD');
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.5);
          doc.setTextColor(76, 29, 149);
          doc.text(
            'Info IPL Rapel Bulan Berikutnya: ' + SiwargaAPI.formatRupiah(report.deferredFutureTotal) +
            ' (' + formatFuturePeriods(report.deferredFuturePeriods) + ') dialokasikan ke bulan masing-masing · Saldo Kas Riil di Rekening: ' +
            SiwargaAPI.formatRupiah(report.saldoKasRiil),
            margin + 2.5,
            boxY + boxH + 8.8
          );
          curY = boxY + boxH + 17;
        }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(30, 41, 59);
        doc.text('Buku Kas Umum (Mutasi & Saldo Berjalan)', margin, curY);

        const bodyRows = [
          [
            { content: 'Saldo Awal Periode', colSpan: 6, styles: { fontStyle: 'bold', fillColor: [248, 250, 252], textColor: [30, 41, 59] } },
            { content: SiwargaAPI.formatRupiah(report.saldoAwalPeriode), styles: { halign: 'right', fontStyle: 'bold', fillColor: [248, 250, 252], textColor: [30, 41, 59] } }
          ]
        ];
        (report.ledger || []).forEach((r, idx) => {
          bodyRows.push([
            String(idx + 1),
            SiwargaAPI.formatDateID(r.tanggal),
            r.kategori || '-',
            r.deskripsi || '-',
            r.debit > 0 ? SiwargaAPI.formatRupiah(r.debit) : '-',
            r.kredit > 0 ? SiwargaAPI.formatRupiah(r.kredit) : '-',
            SiwargaAPI.formatRupiah(r.saldo_berjalan)
          ]);
        });
        bodyRows.push([
          { content: 'TOTAL MUTASI & SALDO AKHIR', colSpan: 4, styles: { fontStyle: 'bold', fillColor: [204, 251, 241], textColor: [17, 94, 89] } },
          { content: SiwargaAPI.formatRupiah(report.totalMasuk), styles: { halign: 'right', fontStyle: 'bold', fillColor: [204, 251, 241], textColor: [21, 128, 61] } },
          { content: SiwargaAPI.formatRupiah(report.totalKeluar), styles: { halign: 'right', fontStyle: 'bold', fillColor: [204, 251, 241], textColor: [185, 28, 28] } },
          { content: SiwargaAPI.formatRupiah(report.saldoAkhir), styles: { halign: 'right', fontStyle: 'bold', fillColor: [204, 251, 241], textColor: [17, 94, 89] } }
        ]);

        doc.autoTable({
          startY: curY + 2.5,
          margin: { left: margin, right: margin, bottom: 16 },
          head: [['No', 'Tanggal', 'Kategori', 'Uraian Transaksi', 'Masuk (Debit)', 'Keluar (Kredit)', 'Saldo Berjalan']],
          body: bodyRows,
          theme: 'grid',
          styles: { fontSize: 8, cellPadding: 2.2, textColor: [30, 41, 59], lineColor: [203, 213, 225], lineWidth: 0.2 },
          headStyles: { fillColor: [15, 118, 110], textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center' },
          columnStyles: {
            0: { cellWidth: 9, halign: 'center' },
            1: { cellWidth: 21, halign: 'center' },
            2: { cellWidth: 28 },
            3: { cellWidth: 'auto' },
            4: { cellWidth: 25, halign: 'right' },
            5: { cellWidth: 25, halign: 'right' },
            6: { cellWidth: 27, halign: 'right', fontStyle: 'bold' }
          }
        });

        // Rekap per Kategori
        curY = doc.lastAutoTable.finalY + 8;
        if (curY > pageH - 55) {
          doc.addPage();
          curY = 18;
        }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(30, 41, 59);
        doc.text('Rekap Pemasukan & Pengeluaran per Kategori', margin, curY);

        const katRows = [];
        Object.keys(report.perKategoriMasuk || {}).forEach(cat => {
          katRows.push(['Pemasukan', cat, SiwargaAPI.formatRupiah(report.perKategoriMasuk[cat])]);
        });
        Object.keys(report.perKategoriKeluar || {}).forEach(cat => {
          katRows.push(['Pengeluaran', cat, SiwargaAPI.formatRupiah(report.perKategoriKeluar[cat])]);
        });

          katRows.push(['-', 'Belum ada mutasi pada periode ini', 'Rp 0']);
        }

        doc.autoTable({
          startY: curY + 2.5,
          margin: { left: margin, right: margin, bottom: 16 },
          head: [['Tipe', 'Kategori Pos Anggaran', 'Jumlah']],
          body: katRows,
          theme: 'grid',
